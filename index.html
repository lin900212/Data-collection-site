<body>
  <div id="root"><section class="panel auth"><div class="eyebrow">RESEARCH DESK · TEST</div><h1>正在載入測試工作台…</h1><p class="subtitle">如果畫面沒有更新，請稍候片刻後重新整理。</p></section></div>
  <div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
  <script>
  window.AvailabilityUI=(()=>{
    let wheelPointerHandlerBound=false;
    let calendarSyncRunning=false;
    function renderAvailability(admin){
      if(availabilityLoading||availabilityLoadError){
        const status=availabilityLoading?`<div class="notice" role="status">正在載入 ${esc(calendarMonthTitle(availabilityMonth))} 班表…</div>`:`<div class="alert error" role="alert">${esc(availabilityLoadError)} <button class="btn small" id="retryAvailabilityMonth" type="button">重試</button></div>`;
        return `<section class="panel calendar-panel"><div class="panel-head"><div><h2>研究者可收時間</h2><p class="help">每個時段僅指派一位研究者；月曆會顯示全隊排班。</p></div></div>${calendarToolbar(availabilityMonth,'availability')}${status}</section>`;
      }
      const plan=availabilityPlan||{status:'collecting',slots:[],days:{},template:state.scheduleDefaults?.slots||defaultAvailabilitySlots,submittedBy:{}};
      const published=plan.status==='published';
      const editable=Boolean(plan.roster?.canEditDraft);
      const canEditMonth=Boolean(plan.roster?.canEditMonth);
      const slots=(plan.slots||[]).filter(s=>s.status!=='expired'&&s.status!=='closed').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
      const pending=slots.filter(s=>s.status==='needs_assignment');
      const submitted=Boolean(plan.submittedBy&&plan.submittedBy[state.user.email]);
      const submittedCount=Object.keys(plan.submittedBy||{}).length;
      const renderSlot=s=>{
        const pendingSupport=s.status==='support_pending'&&s.researcherId===state.user.researcherId;
        const day=plan.days&&plan.days[s.date];
        const canAdjust=editable&&state.user.researcherId&&day?.mode!=='custom'&&s.researcherId===state.user.researcherId&&['draft_available','available'].includes(s.status)&&!s.locked;
        const status=s.status==='support_pending'?'待回覆支援':s.status==='draft_available'?'草稿，未發布':s.status==='available'?'可報名':s.status==='booked'?'已報名':s.status==='needs_assignment'?'待認領':s.status;
        const time=canAdjust
          ?`<button class="calendar-time-adjust" type="button" data-adjust-slot="${esc(s.slotId)}" data-adjust-date="${esc(s.date)}" aria-label="調整 ${esc(s.date)} ${esc(s.start)} 時段"><strong>${esc(s.start)}–${esc(s.end)}</strong><span>調整時間</span></button>`
          :`<span class="calendar-event-time"><strong>${esc(s.start)}–${esc(s.end)}</strong></span>`;
        const eventTag=canEditMonth?'button':'div',eventAttrs=canEditMonth?` type="button" data-day-open="${esc(s.date)}" aria-label="開啟 ${esc(s.date)} 班表編輯"`:'';
        return `<div class="calendar-event ${s.status==='booked'?'booked':''} ${s.supportRequest?'requested':''}" style="--person:${esc(s.color)}">${time}<${eventTag} class="calendar-event-main ${canEditMonth?'':'readonly'}"${eventAttrs}><span class="calendar-event-name">${esc(s.researcherName||'待認領')}</span><span class="tag ${s.status==='available'?'green':s.status==='booked'?'red':'amber'}">${esc(status)}</span></${eventTag}>${pendingSupport&&canEditMonth?`<div class="support-actions"><button class="btn small" data-schedule-support="accept" data-date="${esc(s.date)}" data-slot="${esc(s.slotId)}">接受</button><button class="btn small danger" data-schedule-support="decline" data-date="${esc(s.date)}" data-slot="${esc(s.slotId)}">婉拒</button></div>`:''}</div>`;
      };
      const renderItem=s=>renderSlot(s);
      const rosterMonthLabel=calendarMonthTitle(calendarMonthDate(plan.month||calendarMonthKey(availabilityMonth)))+'班表';
      const calendarSyncButton=canEditMonth?'<button class="btn" id="syncResearchCalendar" type="button">更新 Google 預留時段</button>':'';
      const phaseLabel=plan.roster?.phase==='researcher_fill'?'開放填寫中':plan.roster?.phase==='manager_review'?'管理者檢查中':plan.roster?.phase==='publish_day'?'管理者發布日':plan.roster?.phase==='late_review'?'待管理者發布':'本月排班';
      const readOnlyReason=()=>{const roster=plan.roster||{},month=String(plan.month||'');if(roster.currentMonth&&month<roster.currentMonth)return '這是過去月份，排班僅供查看。';if(roster.nextMonth&&month>roster.nextMonth)return `目前只開放本月與下個月；${roster.nextMonth}之後的月份尚未開放。`;if(roster.nextMonth&&month===roster.nextMonth&&Number(roster.day)<20&&!published)return '下月排班將於每月 20 日開放填寫。';return '此月份目前僅供查看。'};
      const workflow=published
        ?`<div class="roster-actions"><div><strong>已發布班表${canEditMonth?' · 可微調':' · 僅供查看'}</strong><div class="help">${canEditMonth?`${admin?'管理者可調整未鎖定時段':'研究者可調整或取消自己的未報名時段'}；已報名場次請用臨時異動。`:''}${canEditMonth&&plan.publishedAt?' ':''}${canEditMonth&&plan.publishedAt?`發布時間：${esc(plan.publishedAt)}`:readOnlyReason()}</div></div><div class="actions">${calendarSyncButton}<span class="tag green">已發布</span></div></div>`
        :!editable
        ?`<div class="roster-actions"><div><strong>此月份僅供查看</strong><div class="help">${esc(readOnlyReason())}</div></div><span class="tag">僅供查看</span></div>`
        :admin
        ?`<div class="roster-actions"><div><strong>${rosterMonthLabel} · ${phaseLabel}</strong><div class="help">已送出 ${submittedCount} 位研究者的班表；發布前仍可修改。管理者於 28 日一次發布整月班表。</div></div><div class="actions">${calendarSyncButton}<button class="btn" id="submitMyMonth">${submitted?'本人已送出':'標記本人班表完成'}</button>${plan.roster?.canPublishDraft?'<button class="btn primary" id="publishMonth">發布班表並同步報名表</button>':''}</div></div>`
        :`<div class="roster-actions"><div><strong>${rosterMonthLabel} · ${submitted?'已送出':'開放填寫'}</strong><div class="help">${submitted?'發布前仍可修改。':'本月可隨時調整；下月班表於每月 20 日開放，管理者 28 日發布。'}</div></div><div class="actions">${calendarSyncButton}<button class="btn primary" id="submitMonth">${submitted?'再次通知管理者':'送出班表進度'}</button></div></div>`;
      const help=plan.status==='published'
        ?'已發布後，研究者可微調或取消自己尚未有人報名的時段；一般時段固定 1 小時，儲存後結束時間自動計算。管理者可調整所有未報名時段或新增時段。已報名場次請使用臨時異動流程。'
        :admin

        const time=admin&&day.mode==='custom'&&!slotLocked?`<div class="schedule-editor-times time-pair compact-time-pair"><label class="field"><span class="sr-only">自訂時段開始</span><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h data-extra-start="${esc(s.slotId)}" value="${esc(s.start)}"></label><span class="time-separator">–</span><label class="field"><span class="sr-only">自訂時段結束</span><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h data-extra-end="${esc(s.slotId)}" value="${esc(s.end)}"></label></div>`:`<strong class="slot-time-range">${esc(s.start)}–${esc(s.end)}</strong>`;
        return `<div class="schedule-editor-row custom-slot-row" data-custom-slot-row="${esc(s.slotId)}"><span class="slot-number">自訂</span>${time}<div class="slot-assignee">${owner}${s.status==='support_pending'?'<span class="meta">待確認</span>':''}</div>${admin?`<label class="checkrow"><input type="checkbox" data-remove-custom-slot="${esc(s.slotId)}" ${slotLocked?'disabled':''}>移除</label>`:''}</div>`;
      }).join('');
      const addTools=admin?`<details class="availability-add-slot"><summary>＋ 新增時段</summary><div class="availability-add-fields"><label class="field"><span class="sr-only">開始時間</span><input id="customStart" type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h value="00:00"></label><span class="time-separator">–</span><label class="field"><span class="sr-only">結束時間</span><output class="time-readout" id="customEndLabel">01:00</output><input id="customEnd" type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h value="01:00" hidden></label><label class="field add-owner"><span class="sr-only">研究者</span><select id="customSlotOwner" aria-label="新增時段研究者"><option value="">待認領</option>${state.researchers.map(r=>`<option value="${esc(r.researcherId)}">${esc(r.name)}</option>`).join('')}</select></label><label class="checkrow add-slot-enable"><input id="customSlotEnabled" type="checkbox">新增這個時段</label></div></details><label class="checkrow advanced-mode-toggle"><input id="fullyCustom" type="checkbox" ${day.mode==='custom'?'checked':''}>完全自訂</label>`:'';
      const selectAll=admin?'':`<label class="checkrow select-all-slots"><input id="selectAllDaySlots" type="checkbox">全選待認領時段</label>`;
      modal(`<div class="panel-head"><div><div class="eyebrow">${esc(calendarMonthTitle(availabilityMonth))}｜月班表</div><h2>${esc(date)} 可收時間</h2></div><button class="btn" type="button" id="closeDayEditor" aria-label="關閉">×</button></div><p class="help availability-summary">每場 60 分鐘 · 間隔至少 30 分鐘 · 最晚 18:30</p>${selectAll}<div class="schedule-editor-header"><span>時段</span><span>時間</span><span>研究者</span></div><div class="day-editor-list">${rows}</div>${customRows?`<section class="custom-slots-section"><h3>其他時段</h3>${customRows}</section>`:''}<label class="checkrow lunch-toggle" ${day.mode==='custom'?'hidden':''}><input id="lunchBreak" type="checkbox" ${workingLunch?'checked':''}>保留 1 小時午休</label>${addTools}<div id="dayEditorError" class="alert error" role="alert" hidden></div><div class="availability-editor-actions"><button class="btn" type="button" id="cancelDayEditor">取消</button><button class="btn primary" type="button" id="saveDaySlots">儲存</button></div>`);
      $('#modalbox').classList.add('availability-modal');bind24HourFields($('#modalbox'));
      const editorError=message=>{const box=$('#dayEditorError');box.textContent=message;box.hidden=false};
      const clearError=()=>{const box=$('#dayEditorError');box.hidden=true;box.textContent=''};
      const isCustomMode=()=>admin&&Boolean($('#fullyCustom')?.checked);
      const renderWorking=()=>{workingSlots.forEach((slot,index)=>{const start=document.querySelector('[data-start-index="'+index+'"]'),end=document.querySelector('[data-end-label="'+index+'"]'),customEnd=document.querySelector('[data-end-index="'+index+'"]');if(start)start.value=slot.start;if(end)end.textContent=slot.end;if(customEnd)customEnd.value=slot.end});workingCustomSlots.forEach(slot=>{const row=document.querySelector('[data-custom-slot-row="'+slot.slotId+'"]'),start=row?.querySelector('[data-extra-start]'),end=row?.querySelector('[data-extra-end]');if(start)start.value=slot.start;if(end)end.value=slot.end})};
      const validatePreview=(candidate,lunch)=>{
        const active=[...candidate,...workingCustomSlots].filter(s=>s.start&&s.end&&!['closed','expired'].includes(s.status)).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
        for(let i=0;i<active.length;i++){
          const start=active[i].start,end=active[i].end;
          if(!isValidTime24h(start)||!isValidTime24h(end)||end<=start)throw new Error('請輸入有效的 24 小時制時間。');
          const duration=(Number(end.slice(0,2))*60+Number(end.slice(3)))-(Number(start.slice(0,2))*60+Number(start.slice(3)));
          if(!isCustomMode()&&duration!==60)throw new Error('一般時段固定 60 分鐘。');
          if(!isCustomMode()&&end>'18:30')throw new Error('一般時段最晚於 18:30 結束。');
          if(i){const gap=(Number(start.slice(0,2))*60+Number(start.slice(3)))-(Number(active[i-1].end.slice(0,2))*60+Number(active[i-1].end.slice(3)));if(gap<0)throw new Error('時段不可重疊。');if(!isCustomMode()&&gap<30)throw new Error('時段至少需間隔 30 分鐘。')}
        }
        if(lunch&&!isCustomMode()&&candidate.length>=3){const boundaryId=day.lunchAfterSlotId||candidate[1]?.slotId,index=candidate.findIndex(s=>String(s.slotId)===String(boundaryId));if(index>=0&&index<candidate.length-1){const left=candidate[index],right=candidate[index+1];const gap=(Number(right.start.slice(0,2))*60+Number(right.start.slice(3)))-(Number(left.end.slice(0,2))*60+Number(left.end.slice(3)));if(gap!==60)throw new Error('已保留午休，午休前後需剛好 60 分鐘。')}}
      };
      const shift=(candidate,first,delta)=>{
        for(let i=first;i<candidate.length;i++){const slot=candidate[i];if(locked(slot))throw new Error('後續時段已鎖定或待確認，無法連動調整。');if(!admin&&slot.researcherId&&slot.researcherId!==myId)throw new Error('後續時段由其他研究者負責，無法連動調整。')}
        for(let i=first;i<candidate.length;i++){const slot=candidate[i],start=Number(slot.start.slice(0,2))*60+Number(slot.start.slice(3))+delta,end=Number(slot.end.slice(0,2))*60+Number(slot.end.slice(3))+delta;if(start<0||end>=1440)throw new Error('調整會跨到隔日，請縮小時間變更。');slot.start=String(Math.floor(start/60)).padStart(2,'0')+':'+String(start%60).padStart(2,'0');slot.end=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0')}
      };
      const timePair=(slot,startAttr,endAttr,custom)=>`<div class="schedule-editor-times time-pair compact-time-pair"><label class="field"><span class="sr-only">開始時間</span><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" aria-label="開始時間" data-time-24h ${startAttr} value="${esc(slot.start)}"></label><span class="time-separator" aria-hidden="true">–</span><label class="field"><span class="sr-only">結束時間</span>${custom?`<input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" aria-label="結束時間" data-time-24h ${endAttr} value="${esc(slot.end)}">`:`<output class="time-readout" ${endAttr}>${esc(slot.end)}</output>`}</label></div>`;
      const renderTimeMode=()=>{
        const custom=isCustomMode();
        workingSlots.forEach((slot,index)=>{const row=document.querySelector('[data-draft-row="'+index+'"]'),current=row?.querySelector('.schedule-editor-times,.slot-time-range');if(!current)return;const canEdit=!locked(slot)&&slot.status!=='support_pending'&&(admin||!slot.researcherId||slot.researcherId===myId);if(!canEdit)return;current.outerHTML=custom?timePair(slot,`data-start-index="${index}"`,`data-end-index="${index}"`,true):timePair(slot,`data-start-index="${index}"`,`data-end-label="${index}"`,false)});
        workingCustomSlots.forEach(slot=>{const row=document.querySelector('[data-custom-slot-row="'+slot.slotId+'"]'),current=row?.querySelector('.schedule-editor-times,.slot-time-range');if(!current||locked(slot)||!admin)return;current.outerHTML=custom?timePair(slot,`data-extra-start="${esc(slot.slotId)}"`,`data-extra-end="${esc(slot.slotId)}"`,true):`<strong class="slot-time-range">${esc(slot.start)}–${esc(slot.end)}</strong>`});
        bind24HourFields($('#modalbox'));bindDraftTimeListeners();renderWorking();
      };
      const checks=[...document.querySelectorAll('[data-day-slot]')];
      $('#selectAllDaySlots')?.addEventListener('change',e=>checks.filter(box=>!box.disabled).forEach(box=>{box.checked=e.target.checked}));
      checks.forEach(box=>box.addEventListener('change',()=>{const all=$('#selectAllDaySlots');if(all)all.checked=checks.filter(x=>!x.disabled).length>0&&checks.filter(x=>!x.disabled).every(x=>x.checked)}));
      const bindDraftTimeListeners=()=>{
        document.querySelectorAll('[data-start-index]').forEach(input=>{if(input.dataset.changeBound)return;input.dataset.changeBound='1';input.addEventListener('change',()=>{
          const index=Number(input.dataset.startIndex),next=workingSlots.map(s=>Object.assign({},s)),target=next[index];
          try{
            if(!target||!isValidTime24h(input.value))throw new Error('請輸入有效時間，例如 09:30。');
            if(locked(target))throw new Error('此時段已鎖定，不能調整。');
            if(!admin&&target.researcherId&&target.researcherId!==myId)throw new Error('你只能調整自己的時段或待認領時段。');
            if(isCustomMode()){const row=input.closest('[data-draft-row]'),end=row?.querySelector('[data-end-index]')?.value||target.end;target.start=input.value;target.end=end;validatePreview(next,false);workingSlots=next;clearError();renderWorking();return}
            const start=Number(input.value.slice(0,2))*60+Number(input.value.slice(3)),old=Number(target.start.slice(0,2))*60+Number(target.start.slice(3)),delta=start-old,end=start+60;
            if(end>=1440)throw new Error('結束時間不能跨日。');
            target.start=input.value;target.end=String(Math.floor(end/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0');
            shift(next,index+1,delta);validatePreview(next,workingLunch);
            workingSlots=next;scheduleEdits.push({type:'time',index,start:input.value});clearError();renderWorking();
          }catch(error){editorError(error.message||String(error));renderWorking()}
        })});
        document.querySelectorAll('[data-end-index]').forEach(input=>{if(input.dataset.changeBound)return;input.dataset.changeBound='1';input.addEventListener('change',()=>{
          const index=Number(input.dataset.endIndex),next=workingSlots.map(s=>Object.assign({},s)),target=next[index];
          try{if(!isCustomMode()||!target||!isValidTime24h(input.value))throw new Error('請輸入有效的 24 小時制時間。');target.end=input.value;validatePreview(next,false);workingSlots=next;clearError();renderWorking()}catch(error){editorError(error.message||String(error));renderWorking()}
        })});
        document.querySelectorAll('[data-extra-start],[data-extra-end]').forEach(input=>{if(input.dataset.changeBound)return;input.dataset.changeBound='1';input.addEventListener('change',()=>{
          const row=input.closest('[data-custom-slot-row]'),slotId=row?.dataset.customSlotRow,target=workingCustomSlots.find(s=>String(s.slotId)===String(slotId)),next=workingCustomSlots.map(s=>Object.assign({},s)),prior=workingCustomSlots;
          try{if(!isCustomMode()||!target||!isValidTime24h(input.value))throw new Error('請輸入有效的 24 小時制時間。');const edited=next.find(s=>String(s.slotId)===String(slotId));edited[input.hasAttribute('data-extra-start')?'start':'end']=input.value;workingCustomSlots=next;validatePreview(workingSlots,false);clearError();renderWorking()}catch(error){workingCustomSlots=prior;editorError(error.message||String(error));renderWorking()}
        })});
      };
      bindDraftTimeListeners();
      $('#lunchBreak').addEventListener('change',event=>{
        const enabled=event.target.checked,next=workingSlots.map(s=>Object.assign({},s));
        try{
          const boundaryId=day.lunchAfterSlotId||next[1]?.slotId,boundary=next.findIndex(s=>String(s.slotId)===String(boundaryId));
          if(boundary<0||boundary>=next.length-1)throw new Error('這天沒有可調整午休的時段位置。');
          shift(next,boundary+1,enabled?30:-30);validatePreview(next,enabled);
          workingSlots=next;workingLunch=enabled;scheduleEdits.push({type:'lunch',enabled});clearError();renderWorking();
        }catch(error){event.target.checked=workingLunch;editorError(error.message||String(error))}
      });
      $('#customStart')?.addEventListener('change',event=>{const end=addMinutesLabel(event.target.value,60)||'—';if($('#fullyCustom')?.checked)$('#customEnd').value=end;else $('#customEndLabel').textContent=end});
      $('#fullyCustom')?.addEventListener('change',event=>{if(!event.target.checked)try{validatePreview(workingSlots,workingLunch)}catch(error){event.target.checked=true;editorError(error.message||String(error));return}const end=$('#customEnd'),label=$('#customEndLabel');if(end)end.hidden=!event.target.checked;if(label)label.hidden=event.target.checked;const lunch=$('#lunchBreak')?.closest('.lunch-toggle');if(lunch)lunch.hidden=event.target.checked;renderTimeMode();clearError()});
      document.querySelectorAll('[data-day-support]').forEach(button=>button.addEventListener('click',async()=>{
        const decision=button.dataset.daySupport,reason=decision==='decline'?await window.askForReason('婉拒支援','請填寫婉拒原因。'):'';
        if(decision==='decline'&&!reason)return;
        button.disabled=true;try{await api('setScheduleSupportResponse',sessionToken,availabilityPlan.month,date,button.dataset.slot,decision,reason);closeModal();await load();flash('已回覆支援請求。')}
        catch(error){button.disabled=false;editorError(error.message||String(error))}
      }));
      $('#saveDaySlots').addEventListener('click',async event=>{
        const button=event.currentTarget,mode=admin&&$('#fullyCustom')?.checked?'custom':'standard';
        const assignments={},selectedIndexes=[];
        if(admin)document.querySelectorAll('[data-slot-owner]').forEach(select=>{const index=Number(select.dataset.slotOwner);assignments[index]=select.value;if(select.value)selectedIndexes.push(index)});
        else checks.filter(box=>box.checked).forEach(box=>selectedIndexes.push(Number(box.dataset.index)));
        try{validatePreview(workingSlots,mode==='standard'&&workingLunch)}catch(error){editorError(error.message||String(error));return}
        const customTimes=mode==='custom'?[...document.querySelectorAll('[data-start-index]')].map(input=>{const index=Number(input.dataset.startIndex),start=input.value,end=document.querySelector('[data-end-index="'+index+'"]')?.value||'';return {index,start,end}}).concat([...document.querySelectorAll('[data-extra-start]')].map(input=>{const row=input.closest('[data-custom-slot-row]'),slotId=row?.dataset.customSlotRow,start=input.value,end=row?.querySelector('[data-extra-end]')?.value||'';return {slotId,start,end}})):[];
        if(mode==='custom'&&customTimes.some(item=>!isValidTime24h(item.start)||!isValidTime24h(item.end)||item.end<=item.start)){editorError('完全自訂時段的開始與結束時間都必須有效，且結束時間要晚於開始時間。');return}
        const customSlotAssignments=admin?[...document.querySelectorAll('[data-extra-owner]')].filter(select=>!document.querySelector('[data-remove-custom-slot="'+select.dataset.extraOwner+'"]')?.checked).map(select=>({slotId:select.dataset.extraOwner,researcherId:select.value})):[];
        const removeCustomSlotIds=admin?[...document.querySelectorAll('[data-remove-custom-slot]:checked')].map(input=>input.dataset.removeCustomSlot):[];
        const customStart=$('#customStart')?.value||'',customEnd=mode==='custom'?($('#customEnd')?.value||''):addMinutesLabel(customStart,60)||'',customOwner=$('#customSlotOwner')?.value||'';
        const customSlot=admin&&$('#customSlotEnabled')?.checked?{start:customStart,end:customEnd,researcherId:customOwner}:null;
        if(customSlot&&(!isValidTime24h(customStart)||!isValidTime24h(customEnd))){editorError('新增時段請使用 24 小時制 HH:mm。');return}
        const input={selectedIndexes,assignments,researcherId:admin?myId:'',lunchBreak:workingLunch,mode,scheduleEdits,customTimes:mode==='custom'?customTimes:undefined,customSlot,customSlotAssignments,removeCustomSlotIds,expectedRevision:availabilityPlan?.revision};
        const save=async(confirmedPairs=[])=>{
          input.ownerCalendarConfirmedKeys=confirmedPairs;button.disabled=true;button.textContent='儲存中…';
          try{
            const result=await api('saveAvailabilityDay',sessionToken,availabilityPlan.month,date,input);
            if(result.calendarConflict){button.disabled=false;button.textContent='儲存';showCalendarConflict(result,keys=>save([...confirmedPairs.filter(pair=>!pair.startsWith(result.calendarSlotKey+'|')),...keys.map(key=>result.calendarSlotKey+'|'+key)]),async()=>{await load();openAvailabilityEditor(date,admin)});return}
            closeModal();await load();flash(result.calendarConflictAccepted?'已確認主要日曆衝突，班表已儲存。':'班表已儲存。');
          }catch(error){button.disabled=false;button.textContent='儲存';editorError(error.message||String(error))}
        };
        save().catch(error=>{button.disabled=false;button.textContent='儲存';editorError(error.message||String(error))});
      });
      $('#closeDayEditor').addEventListener('click',closeModal);$('#cancelDayEditor').addEventListener('click',closeModal);
    }
    function openDraftSlotTimeEditor(date,slotId){
      const admin=state.user.role==='admin';
      return openAvailabilityEditor(date,admin);
    }
    async function addAvailabilityBatch(date,slots,researcherId,index=0,added=0,confirmedKeys=[]){
      if(index>=slots.length){closeModal();await load();flash(`已新增 ${added} 個可收時段。`);return}
      const slot=slots[index];let result;
      try{result=await api('addAvailability',sessionToken,{date,start:slot.start,end:slot.end,researcherId},confirmedKeys)}
      catch(err){closeModal();await load();showError(new Error(added?`已新增 ${added} 個時段；後續未完成：${err.message||err}`:(err.message||String(err))));return}
      if(result.calendarConflict){showCalendarConflict(result,keys=>addAvailabilityBatch(date,slots,researcherId,index,added,keys),async()=>{await load();if(added)flash(`已新增 ${added} 個時段；其餘時段已取消。`)});return}
      return addAvailabilityBatch(date,slots,researcherId,index+1,added+1,[]);
    }
    function showCalendarConflict(result,retry,onCancel){
      const rows=(result.conflicts||[]).map(event=>`<div class="calendar-conflict-item"><strong>${esc(event.title)}</strong><span>${esc(event.time)}</span></div>`).join('');
      modal(`<div class="calendar-conflict-heading"><span class="calendar-conflict-icon" aria-hidden="true">!</span><div><div class="eyebrow">主要 GOOGLE 日曆</div><h2>這段時間已有行程</h2></div></div><p>${esc(result.date)}　${esc(result.start)}–${esc(result.end)}｜研究者：${esc(result.researcherName||'管理者本人')}</p>${result.calendarConflictChanged?'<div class="alert">行事曆在你確認期間有變動，請重新查看目前的重疊行程。</div>':''}<div class="calendar-conflict-list">${rows}</div><p class="help">這是重疊提醒，系統不會替你判斷能否同時進行。選擇繼續只會新增／指派研究時段，不會修改主要日曆中的行程。</p><div class="actions"><button class="btn" id="cancelCalendarConflict">取消排班</button><button class="btn primary" id="acceptCalendarConflict">我確認可同時執行</button></div>`);
      $('#cancelCalendarConflict').addEventListener('click',async()=>{closeModal();if(onCancel)await onCancel()});
      $('#acceptCalendarConflict').addEventListener('click',async e=>{
        e.currentTarget.disabled=true;
        try{await retry((result.conflicts||[]).map(event=>event.key))}catch(err){closeModal();showError(err)}
      });
    }

    async function submitAvailability(confirmedKeys=[]){
      const result=await api('addAvailability',sessionToken,{date:$('#slotDate').value,start:$('#slotStart').value,end:$('#slotEnd').value,researcherId:$('#slotResearcher')?.value||''},confirmedKeys);
      if(result.calendarConflict){showCalendarConflict(result,keys=>submitAvailability(keys));return}
      closeModal();await load();if(result.calendarConflictAccepted)flash('已記錄你確認可與主要日曆行程同時執行。');
    }

    async function submitSlotAssignment(slotId,researcherId,confirmedKeys=[]){
      const result=await api('assignUnassignedSlot',sessionToken,slotId,researcherId,confirmedKeys);
      if(result.calendarConflict){showCalendarConflict(result,keys=>submitSlotAssignment(slotId,researcherId,keys));return}
      closeModal();await load();if(result.calendarConflictAccepted)flash('已記錄你確認可與主要日曆行程同時執行。');
    }

    async function syncResearchCalendars(){
      if(calendarSyncRunning)return;
      calendarSyncRunning=true;
      let created=0,updated=0,unchanged=0,deleted=0;
      try{
        const month=calendarMonthKey(availabilityMonth),plan=await api('getResearchCalendarSyncPlan',sessionToken,month),targets=plan.researchers||[];
        if(!targets.length)throw new Error('找不到可更新的研究者日曆。');
        for(let index=0;index<targets.length;index++){
          const target=targets[index];let offset=0,done=false;
          do{
            setRequestStatus(`正在更新 ${target.name} 的研究日曆（${Math.min(offset,target.count)}／${target.count}）…`);
            const result=await api('syncResearchCalendarBatch',sessionToken,month,target.researcherId,offset,target.snapshotKey);
            created+=Number(result.created||0);updated+=Number(result.updated||0);unchanged+=Number(result.unchanged||0);deleted+=Number(result.deleted||0);offset=Number(result.nextOffset||0);done=Boolean(result.done);
            setRequestStatus(`正在更新第 ${index+1}／${targets.length} 位研究者的日曆（${offset}／${target.count}）…`);
          }while(!done);
        }
        await loadAvailabilityMonth({force:true});await load();
        flash(`研究日曆已更新；新增 ${created}、更新 ${updated}、未變更 ${unchanged}、移除 ${deleted} 個時段。`);
      }catch(error){showError(error)}
      finally{calendarSyncRunning=false}
    }

    return {renderAvailability,addMinutesLabel,isValidTime24h,normalizeTimeEntry,bind24HourFields,openPublishedAvailabilityEditor,openAvailabilityEditor,openDraftSlotTimeEditor,addAvailabilityBatch,showCalendarConflict,submitAvailability,submitSlotAssignment,syncResearchCalendars};
  })();
</script>

  <script>
    window.addEventListener('error',function(e){
      const root=document.getElementById('root');
      if(root)root.innerHTML='<section class="panel auth"><div class="eyebrow">FRONTEND ERROR</div><h1>工作台載入失敗</h1><div class="alert error">'+String(e.message||'前端初始化失敗')+'</div><p class="help">請將此錯誤訊息提供給管理者，以便修復測試版。</p></section>';
    });

        ?`<div class="alert ${relay.needsAttention?'error':''}">主要寄件帳號剩餘 ${relay.primaryRemaining??'未知'} 位收件人額度；寄信佇列待寄 ${relay.pending} 封、需處理 ${relay.needsAttention} 封。${relay.enabled?'':'備援目前未啟用。'}${relay.error?esc(relay.error):'請到獨立寄信佇列查看狀態。'}</div>`:'';
      const effects=admin&&state.sideEffects;
      const effectsAlert=effects&&(effects.pending||effects.needsReview||effects.inFlight)
        ?`<div class="alert ${effects.needsReview?'error':''}">背景寄送／行事曆作業：待處理 ${effects.pending} 項、執行中 ${effects.inFlight} 項、需檢查 ${effects.needsReview} 項。${effects.needsReview?'系統不會自動重送可能已完成的項目，請檢查 Apps Script 執行記錄後再處理。':''}</div>`:'';
      const formSyncAlert=admin&&state.formSync?.pending?`<div class="alert error">報名表同步失敗，系統會在背景重試；目前表單選項可能尚未反映最新班表。${esc(state.formSync.error||'')}</div>`:'';
      return `${formSyncAlert}${effectsAlert}${mailAlert}<div class="metrics">${metric('已保留／完成',`${booked} / ${state.target}`,'目標 119 位')}${metric('可報名時段',state.summary.available,'至少提前 12 小時')}${metric(admin?'需管理者審核':'等你確認',pending,'處理後會更新')}${metric('待協調',state.summary.coordination,'改期或請求支援')}</div><div class="grid"><section class="panel"><div class="panel-head"><h2>待處理</h2><button class="btn small" data-view="workflow">開啟審核流程 →</button></div>${state.applications.filter(a=>admin?['review','needs_coordination','reschedule_pending'].includes(a.status):['researcher_pending','reschedule_pending'].includes(a.status)&&(a.assignedResearcherId===state.user.researcherId||a.proposedResearcherId===state.user.researcherId)).slice(0,5).map(appCard).join('')||'<div class="empty">目前沒有待處理案件</div>'}</section><section class="panel"><div class="panel-head"><h2>接下來的實驗</h2><button class="btn small" data-view="appointments">查看行程 →</button></div>${state.applications.filter(a=>['confirmed','completed'].includes(a.status)).sort((a,b)=>a.slot.localeCompare(b.slot)).slice(0,5).map(a=>`<div class="slotline" style="--person:${a.researcherColor}"><strong>${esc(a.slot)}</strong><div>${esc(a.name)} · ${esc(a.researcherName)}</div></div>`).join('')||'<div class="empty">近期沒有已確認場次</div>'}</section></div>`;
    }
    function appCard(a){return `<article class="card"><div class="card-top"><div><h3>${esc(a.name)} <span class="tag ${a.status==='review'?'amber':a.status==='confirmed'?'green':'red'}">${esc(statusName[a.status]||a.status)}</span>${['confirmed','completed'].includes(a.status)?` <span class="tag ${a.acknowledgedAt?'green':'amber'}">${a.acknowledgedAt?'已確認收到':'等待收到確認'}</span>`:''}</h3><div class="meta">${esc(a.slot)} · ${esc(a.school||'未填學校')} · ${esc(a.age||'')} 歲${a.researcherName?' · '+esc(a.researcherName):''}${a.acknowledgedAt?' · 收到確認 '+esc(a.acknowledgedAt):''}</div></div></div>${a.flags?`<div class="flags">系統提醒：${esc(a.flags)}</div>`:''}${a.status==='reschedule_pending'?`<div class="notice">改期新時段：${esc(a.proposedSlot)} · ${esc(a.proposedResearcherName)}</div>`:''}</article>`}
    function calendarDate(year,monthIndex,day){return `${year}-${String(monthIndex+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
    function calendarMonthTitle(month){return `${month.getFullYear()} 年 ${month.getMonth()+1} 月`}
    function shiftCalendarMonth(month,delta){return new Date(month.getFullYear(),month.getMonth()+delta,1)}
    function calendarLegend(){return state.researchers.map(r=>`<span class="calendar-legend-item"><i class="color-dot" style="--person:${esc(r.color)}"></i>${esc(r.name)}</span>`).join('')}
    function renderMonthGrid(month,items,renderItem,addButton){
      const year=month.getFullYear(),monthIndex=month.getMonth(),leading=new Date(year,monthIndex,1).getDay();
      const dayCount=new Date(year,monthIndex+1,0).getDate(),cellCount=Math.ceil((leading+dayCount)/7)*7;
      const byDate=items.reduce((map,item)=>{(map[item.date]||(map[item.date]=[])).push(item);return map},{ });
      return Array.from({length:cellCount},(_,index)=>{
        const day=index-leading+1;
        if(day<1||day>dayCount)return '<div class="calendar-day outside" aria-hidden="true"></div>';
        const date=calendarDate(year,monthIndex,day),dow=new Date(year,monthIndex,day).getDay(),events=(byDate[date]||[]).sort((a,b)=>(a.start||'').localeCompare(b.start||''));
        const weekday=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'][dow];
        return `<div class="calendar-day ${dow===0||dow===6?'weekend':''}"><div class="calendar-day-head"><span class="calendar-day-number">${day} <small class="calendar-weekend">${dow===0||dow===6?'週末':''}</small><small class="calendar-mobile-weekday">${weekday}</small></span>${addButton?`<button class="btn calendar-day-add" type="button" data-day-add="${date}" aria-label="編輯 ${date} 時段">＋</button>`:''}</div><div class="calendar-events">${events.map(renderItem).join('')}</div></div>`;
      }).join('');
    }
    function calendarToolbar(month,kind){const roster=kind==='availability'?availabilityPlan?.roster:null,nextLabel=roster?(roster.day<20?'下月班表':availabilityPlan.status==='published'?'已發布下月':'下月草稿'):'',shortcuts=roster?`<div class="calendar-shortcuts"><button class="btn small ${calendarMonthKey(month)===roster.currentMonth?'primary':''}" type="button" data-calendar-goto="availability:${roster.currentMonth}">本月</button><button class="btn small ${calendarMonthKey(month)===roster.nextMonth?'primary':''}" type="button" data-calendar-goto="availability:${roster.nextMonth}">${nextLabel}</button></div>`:'';return `<div class="calendar-top"><div class="calendar-period"><button class="btn calendar-nav" type="button" data-calendar-nav="${kind}:-1" aria-label="上個月">‹</button><h2>${calendarMonthTitle(month)}</h2><button class="btn calendar-nav" type="button" data-calendar-nav="${kind}:1" aria-label="下個月">›</button></div>${shortcuts}<div class="calendar-legend">${calendarLegend()}</div></div>`}
    function renderWorkflow(admin){
      const cases=state.applications.filter(a=>admin?['review','researcher_pending','needs_coordination','reschedule_pending'].includes(a.status):['researcher_pending','reschedule_pending'].includes(a.status)&&(a.assignedResearcherId===state.user.researcherId||a.proposedResearcherId===state.user.researcherId));
      if(!cases.length)return '<section class="panel"><div class="empty">目前沒有待處理案件</div></section>';
      return cases.map(a=>`<section class="panel"><div class="panel-head"><div><h2>${esc(a.name)}</h2><div class="meta">${esc(a.slot)} · ${esc(a.school)} · ${esc(a.age)} 歲 · ${esc(a.email)}</div></div><span class="tag ${a.status==='review'?'amber':'red'}">${esc(statusName[a.status]||a.status)}</span></div>${a.flags?`<div class="flags">系統提醒：${esc(a.flags)}${admin?`<button class="btn small" data-sensitive="${esc(a.applicationId)}">檢視敏感比對資料</button>`:''}</div>`:''}${a.status==='needs_coordination'&&a.lastStatusNote?`<div class="alert">研究者回覆：${esc(a.lastStatusNote)}</div>`:''}${a.status==='reschedule_pending'?`<div class="notice">新時段：${esc(a.proposedSlot)} · 負責研究者：${esc(a.proposedResearcherName)}。舊時段仍保留。</div>`:''}${admin&&a.status==='review'?`<div class="actions"><button class="btn primary" data-review="approve" data-app="${esc(a.applicationId)}">審核通過，請研究者確認</button><button class="btn danger" data-review="reject" data-app="${esc(a.applicationId)}">不符合／請改期</button></div>`:''}${admin&&a.status==='needs_coordination'&&a.assignedResearcherId?`<div class="field"><label>再次確認說明（必填）</label><input data-recheck-message="${esc(a.applicationId)}" placeholder="例如：原排班已確認，想請你再評估是否能執行"></div><button class="btn" data-recheck="${esc(a.applicationId)}">請原負責研究者再次確認</button>`:''}${admin&&['needs_coordination','researcher_pending'].includes(a.status)?`<div class="grid"><div class="field"><label>安排支援研究者</label><select data-support="${esc(a.applicationId)}"><option value="">選擇研究者</option>${state.researchers.filter(r=>r.researcherId!==a.assignedResearcherId).map(r=>`<option value="${esc(r.researcherId)}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>支援原因／說明</label><input data-support-message="${esc(a.applicationId)}" placeholder="例如原負責研究者無法到校"></div></div><button class="btn" data-request-support="${esc(a.applicationId)}">寄出支援請求</button>`:''}${['researcher_pending','reschedule_pending'].includes(a.status)&&(a.assignedResearcherId===state.user.researcherId||a.proposedResearcherId===state.user.researcherId)?researcherResponseForm(a):''}</section>`).join('');
    }
    function researcherResponseForm(a){return `<form class="response-form" data-response="${esc(a.applicationId)}"><div class="actions"><label class="checkrow"><input type="radio" name="decision" value="accept" required> 可以執行</label><label class="checkrow"><input type="radio" name="decision" value="decline" required> 無法執行</label></div><div class="grid"><div class="field"><label>無法執行原因</label><select name="reason"><option value="">請選擇</option><option>臨時有課／工作</option><option>設備或場地問題</option><option>身體狀況</option><option>其他</option></select></div><div class="field"><label>補充說明（無法執行時必填）</label><input name="detail" placeholder="請簡短說明"></div></div><button class="btn primary" type="submit">送出研究者回覆</button></form>`}
    function renderAppointments(admin){

      const calendarLinks=[`<a class="link" target="_blank" rel="noopener" href="https://calendar.google.com/calendar/u/0/r">開啟主要 Google 日曆 ↗</a>`,...(state.researchCalendars||[]).map(calendar=>`<a class="link" target="_blank" rel="noopener" href="${esc(calendar.url)}">開啟 ${esc(calendar.name)} ↗</a>`)].join('');

      const mine=state.applications.filter(a=>a.status==='confirmed'&&a.assignedResearcherId===state.user.researcherId).sort((a,b)=>a.slot.localeCompare(b.slot));
      const changeCards=(state.scheduleChanges||[]).filter(c=>c.status!=='cancelled').sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||''))).slice(0,10).map(c=>{
        const app=state.applications.find(a=>a.applicationId===c.applicationId),received=c.targetId===state.user.researcherId&&c.status==='pending_researcher';
        if(admin&&['pending_manager','declined'].includes(c.status))return `<article class="card"><div class="panel-head"><div><h3>${esc(c.initiatorName)}｜${esc(c.slot)}</h3><div class="meta">${esc(c.reason)}${c.resolutionReason?' · 研究者回覆：'+esc(c.resolutionReason):''}</div></div><span class="tag amber">待管理者協調</span></div><div class="grid"><div class="field"><label>安排支援研究者</label><select data-resolve-target="${esc(c.id)}"><option value="">選擇研究者</option>${state.researchers.filter(r=>r.researcherId!==c.initiatorId).map(r=>`<option value="${esc(r.researcherId)}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>處理說明／取消原因</label><input data-resolve-reason="${esc(c.id)}" placeholder="說明支援安排或取消原因"></div></div><div class="actions"><button class="btn primary" data-resolve-change="assign" data-change="${esc(c.id)}">請求支援研究者</button><button class="btn danger" data-resolve-change="cancel" data-change="${esc(c.id)}">取消並通知受試者</button></div>${app?`<div class="meta">受試者：${esc(app.name)}　${esc(app.email)}</div>`:''}</article>`;
        if(received)return `<article class="card"><div class="panel-head"><div><h3>${c.type==='swap'?'互換場次':'支援場次'}｜${esc(c.slot)}</h3><div class="meta">${esc(c.initiatorName)}提出${c.otherSlot?'互換 '+esc(c.otherSlot):''}。原因：${esc(c.reason)}${c.managerNote?'；管理者說明：'+esc(c.managerNote):''}</div></div><span class="tag amber">需要你回覆</span></div><div class="actions"><button class="btn primary" data-respond-change="accept" data-change="${esc(c.id)}">接受</button><button class="btn danger" data-respond-change="decline" data-change="${esc(c.id)}">婉拒</button></div></article>`;
        if(admin)return `<article class="card"><strong>${esc(c.slot)}</strong><span class="tag amber">${c.status==='pending_researcher'?'等待 '+esc(c.targetName)+' 回覆':'已處理'}</span><div class="meta">${esc(c.initiatorName)}提出：${esc(c.reason)}${c.managerNote?'；管理者說明：'+esc(c.managerNote):''}</div></article>`;

      return `<section class="panel calendar-panel"><div class="panel-head"><div><h2>受試者實際行程</h2><p class="help">受試者確認錄取後才顯示。研究者可提出互換、找人代班或交由管理者協調。</p></div><div class="actions">${calendarLinks}${calendarLinkNote}</div></div>${calendarToolbar(appointmentMonth,'appointments')}<div class="calendar-scroll"><div class="calendar-weekdays">${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'].map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar-grid">${renderMonthGrid(appointmentMonth,calendarItems,renderAppointment,false)}</div></div>${calendarItems.length?'':'<div class="empty">這個月份尚無已確認的實驗場次</div>'}</section><section class="panel"><h2>我的已排實驗</h2><p class="help">提出臨時異動後，原時間會保留，直到代班或換班研究者接受。</p>${mineCards||'<div class="empty">目前沒有指派給你的已確認場次</div>'}</section>${changeCards?`<section class="panel"><h2>${admin?'待協調的臨時異動':'臨時異動與支援邀請'}</h2>${changeCards}</section>`:''}`;

    function openScheduleChangeRequest(applicationId){
      const app=state.applications.find(item=>item.applicationId===applicationId);
      if(!app)return showError(new Error('找不到這筆已確認場次，請重新整理。'));

      const pendingIds=new Set((state.scheduleChanges||[]).filter(change=>['pending_manager','pending_researcher','declined'].includes(change.status)).flatMap(change=>[change.applicationId,change.otherApplicationId].filter(Boolean)));

      const form=$('#scheduleChangeRequest'),kind=form.elements.kind;

    }
    function renderSessions(admin){const apps=state.applications.filter(a=>['confirmed','completed','no_show'].includes(a.status));return `<section class="panel"><h2>實驗紀錄</h2>${apps.map(a=>{const rec=state.records.find(r=>r.applicationId===a.applicationId)||{};return `<form class="session-form card" data-session="${esc(a.applicationId)}"><div class="card-top"><div><h3>${esc(a.name)}</h3><div class="meta">${esc(a.slot)} · ${esc(a.researcherName)}</div></div></div><div class="grid"><div class="field"><label>出席狀況</label><select name="attendance"><option value="">尚未紀錄</option>${['出席','遲到','未到'].map(x=>`<option ${rec.attendance===x?'selected':''}>${x}</option>`).join('')}</select></div><label class="checkrow"><input type="checkbox" name="result" ${rec.requestedResult==='TRUE'?'checked':''}>受試者主動想收到研究結果</label><label class="checkrow"><input type="checkbox" name="blacklist" ${rec.blacklist==='TRUE'?'checked':''}>黑名單（原因填在備註）</label></div><div class="field"><label>受試者個別狀況</label><textarea name="note" placeholder="例如：不專心作答、看過答案、做過相似測驗">${esc(rec.individualNote||'')}</textarea></div><button class="btn primary" type="submit">儲存紀錄</button></form>`}).join('')||'<div class="empty">確認錄取後，場次會出現在這裡</div>'}</section>`}
    function renderNotes(){return `<section class="panel"><h2>新增整體觀察</h2><div class="grid"><div class="field"><label>日期</label><input id="noteDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>觀察札記</label><textarea id="noteText" placeholder="例如：動作情境下受試者明顯喘，可能影響後續認知作業表現"></textarea></div></div><button class="btn primary" id="saveNote">儲存札記</button></section><section class="panel"><h2>研究觀察紀錄</h2>${state.notes.slice().reverse().map(n=>`<div class="card"><div class="meta">${esc(n.date)} · ${esc(n.observerId)}</div><div>${esc(n.note)}</div></div>`).join('')||'<div class="empty">尚無整體觀察札記</div>'}</section>`}
    function renderResearchers(){return `<section class="panel"><h2>新增研究者</h2><p class="help">新增後，研究者可用團隊信箱收取一次性登入碼。</p><form id="researcherForm"><div class="grid"><div class="field"><label>研究者姓名</label><input name="name" required placeholder="只填名字"></div><div class="field"><label>研究者 Email</label><input name="email" type="email" required></div><div class="field"><label>月曆顏色</label><input name="color" type="color" value="#2b8678"></div></div><button class="btn primary">加入研究者</button></form></section><section class="panel"><h2>研究團隊</h2>${state.researchers.map(r=>`<div class="slotline researcher-row" style="--person:${esc(r.color)}"><span class="color-dot" style="--person:${esc(r.color)}"></span><strong>${esc(r.name)}</strong><span class="meta">${esc(r.email||'研究者帳號')}</span>${r.researcherId!==state.user.researcherId?`<button class="btn small danger" data-remove-researcher="${esc(r.researcherId)}" data-name="${esc(r.name)}">移除</button>`:'<span class="tag">你</span>'}</div>`).join('')||'<div class="empty">尚未加入其他研究者</div>'}<p class="help">移除會立即停用登入並撤銷既有工作階段。若仍有待確認或已排定案件，需先完成支援或改期。</p></section>`}
    function renderSettings(){
      const template=state.scheduleDefaults?.slots||defaultAvailabilitySlots;
      const rows=template.map((s,i)=>`<div class="template-row"><strong>時段 ${i+1}</strong><label class="field"><span>開始</span><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h data-template-start="${i}" value="${esc(s[0])}"></label><span class="template-end">結束：${esc(AvailabilityUI.addMinutesLabel(s[0],60))}</span><button class="btn small danger" type="button" data-template-remove="${i}">移除</button></div>`).join('');
      return `<section class="panel"><h2>測試資源</h2><div class="notice">一般測試通知會依目前測試路由寄送；不會因修改排班預設而發布正式表單。</div><div class="actions"><a class="btn" target="_blank" href="${esc(state.formUrl)}">開啟測試表單</a><a class="btn" target="_blank" href="${esc(state.databaseUrl)}">開啟測試工作流程資料庫</a><button class="btn primary" id="syncForm">同步可報名時段到表單</button></div><p class="help">只有管理者發布月份班表時，表單選項才會同步。時段需距離開始至少 12 小時；達到招募目標或沒有可選時段時，系統會暫停收件。</p><p class="help">每位研究者有自己的研究日曆；更新預留時段會建立或更新事件，研究者確認錄取後，同一事件會轉為正式場次。Lin 的主要 Google 日曆會自動檢查；其他研究者請同時檢視主要與研究日曆。</p></section><section class="panel"><h2>未來月份的預設時段</h2><p class="help">此設定只套用到尚未建立的月份班表；已建立或已發布月份不會被改寫。每場 1 小時、場次間至少 30 分鐘，最晚 18:30。</p><div id="scheduleTemplateRows">${rows}</div><div class="actions"><button class="btn" id="addTemplateSlot" type="button">＋ 新增預設時段</button><button class="btn primary" id="saveScheduleTemplate" type="button">儲存預設</button></div></section><section class="panel"><h2>信件流程</h2><table class="table"><tbody><tr><th>每月 20 日</th><td>通知研究者填寫下月班表，其他未開放月份僅供查看。</td></tr><tr><th>每月 25 日</th><td>提醒尚未送出者；這是進度提醒，不會鎖住修改。</td></tr><tr><th>每月 26–27 日</th><td>管理者檢查空缺與支援請求；28 日提醒尚未送出的研究者並提醒管理者發布。</td></tr><tr><th>管理者發布</th><td>整月一次同步到測試報名表；發布後可微調未報名時段，變更會同步更新報名表。</td></tr><tr><th>受試者確認錄取</th><td>寄出附校園位置圖的錄取信並建立測試日曆事件。</td></tr></tbody></table></section>`
    }
    function bindView(view,admin){
      $('#content').querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{activeView=b.dataset.view;draw()}));
      if(view==='availability'){
        document.querySelectorAll('[data-calendar-nav^="availability:"]').forEach(b=>b.addEventListener('click',()=>{availabilityMonth=shiftCalendarMonth(availabilityMonth,Number(b.dataset.calendarNav.split(':')[1]));loadAvailabilityMonth().catch(showError)}));
        document.querySelectorAll('[data-calendar-goto^="availability:"]').forEach(b=>b.addEventListener('click',()=>{availabilityMonth=calendarMonthDate(b.dataset.calendarGoto.split(':')[1]);loadAvailabilityMonth().catch(showError)}));
        document.querySelectorAll('[data-day-add]').forEach(b=>b.addEventListener('click',()=>AvailabilityUI.openAvailabilityEditor(b.dataset.dayAdd,admin)));
        document.querySelectorAll('[data-day-open]').forEach(b=>b.addEventListener('click',()=>AvailabilityUI.openAvailabilityEditor(b.dataset.dayOpen,admin)));
        document.querySelectorAll('[data-adjust-slot]').forEach(b=>b.addEventListener('click',event=>{event.stopPropagation();AvailabilityUI.openDraftSlotTimeEditor(b.dataset.adjustDate,b.dataset.adjustSlot)}));
        $('#retryAvailabilityMonth')?.addEventListener('click',()=>loadAvailabilityMonth({force:true}));
        $('#syncResearchCalendar')?.addEventListener('click',()=>AvailabilityUI.syncResearchCalendars());
        $('#submitMonth')?.addEventListener('click',async()=>{try{const r=await api('submitMonthAvailability',sessionToken,calendarMonthKey(availabilityMonth));await load();flash(r.message)}catch(err){showError(err)}});
        $('#submitMyMonth')?.addEventListener('click',async()=>{try{const r=await api('submitMonthAvailability',sessionToken,calendarMonthKey(availabilityMonth));await load();flash(r.message)}catch(err){showError(err)}});
        $('#publishMonth')?.addEventListener('click',async()=>{if(!await confirmAction('發布班表',`發布 ${calendarMonthTitle(availabilityMonth)} 班表並同步測試報名表？已報名的月份會被系統擋下，不會覆寫。`,'發布班表'))return;try{const r=await api('publishMonthSchedule',sessionToken,calendarMonthKey(availabilityMonth));await load();flash(`已發布 ${r.month} 班表，共 ${r.count} 個可報名時段。`)}catch(err){showError(err)}});
        document.querySelectorAll('[data-schedule-support]').forEach(button=>button.addEventListener('click',async()=>{const decision=button.dataset.scheduleSupport,reason=decision==='decline'?await askForReason('婉拒支援請求','請說明無法支援的原因。'):'';if(decision==='decline'&&!reason)return;try{if(availabilityPlan.status==='published')await api('respondPublishedSlotSupport',sessionToken,button.dataset.slot,decision,reason);else await api('setScheduleSupportResponse',sessionToken,calendarMonthKey(availabilityMonth),button.dataset.date,button.dataset.slot,decision,reason);await load();flash('已回覆支援請求。')}catch(err){showError(err)}}));
        document.querySelectorAll('.assign-btn').forEach(b=>b.addEventListener('click',()=>{const select=document.querySelector(`[data-assign="${b.dataset.slot}"]`);if(!select.value){showError(new Error('請先選擇研究者。'));return}AvailabilityUI.submitSlotAssignment(b.dataset.slot,select.value).catch(showError)}));
      }
      if(view==='appointments'){
        document.querySelectorAll('[data-calendar-nav^="appointments:"]').forEach(b=>b.addEventListener('click',()=>{appointmentMonth=shiftCalendarMonth(appointmentMonth,Number(b.dataset.calendarNav.split(':')[1]));draw()}));
        document.querySelectorAll('[data-request-change]').forEach(button=>button.addEventListener('click',()=>openScheduleChangeRequest(button.dataset.requestChange)));
        document.querySelectorAll('[data-respond-change]').forEach(button=>button.addEventListener('click',async()=>{
          const decision=button.dataset.respondChange;
          const reason=decision==='decline'?await askForReason('婉拒臨時異動','請說明無法接受這項異動的原因。'):'';
          if(decision==='decline'&&!String(reason||'').trim())return;
          button.disabled=true;
          try{await api('respondSessionChange',sessionToken,button.dataset.change,decision,reason||'');await load();flash(decision==='accept'?'已接受異動，系統已更新研究團隊日曆。':'已婉拒異動，管理者會收到理由。')}
          catch(error){button.disabled=false;showError(error)}
        }));
        document.querySelectorAll('[data-resolve-change]').forEach(button=>button.addEventListener('click',async()=>{
          const id=button.dataset.change,decision=button.dataset.resolveChange;
          const target=[...document.querySelectorAll('[data-resolve-target]')].find(el=>el.dataset.resolveTarget===id)?.value||'';
          const reason=[...document.querySelectorAll('[data-resolve-reason]')].find(el=>el.dataset.resolveReason===id)?.value.trim()||'';
          if(!reason){showError(new Error('請填寫安排或取消的說明。'));return}
          if(decision==='assign'&&!target){showError(new Error('請先選擇支援研究者。'));return}
          const warning=decision==='cancel'?'確定取消這位受試者的場次並寄出通知嗎？':'會寄出支援確認信；原時間會保留到研究者接受。要繼續嗎？';
          if(!await confirmAction('確認處理異動',warning,decision==='cancel'?'取消場次':'安排支援'))return;
          button.disabled=true;
          try{const result=await api('resolveScheduleChange',sessionToken,id,decision,target,reason);await load();flash(result.status==='pending_researcher'?'已寄出支援確認邀請。':'已取消場次並通知受試者。')}
          catch(error){button.disabled=false;showError(error)}
        }));
      }
      if(view==='workflow'){
        document.querySelectorAll('[data-review]').forEach(b=>b.addEventListener('click',async()=>{let reason='';if(b.dataset.review==='reject'){reason=await askForReason('不符合資格／請改期','請填寫處理原因，系統會依此通知報名者。','例如：不符合研究條件，或原時段無法安排');if(!reason)return}await callAndReload('adminReview',b.dataset.app,b.dataset.review,reason)}));
        document.querySelectorAll('[data-request-support]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.requestSupport,rid=document.querySelector(`[data-support="${id}"]`).value,msg=document.querySelector(`[data-support-message="${id}"]`).value;callAndReload('requestSupport',id,rid,msg)}));
        document.querySelectorAll('[data-recheck]').forEach(button=>button.addEventListener('click',async()=>{const id=button.dataset.recheck,message=document.querySelector(`[data-recheck-message="${id}"]`)?.value.trim()||'';if(!message){showError(new Error('請填寫再次確認的說明。'));return}if(!await confirmAction('再次邀請原研究者','系統會重新寄出確認邀請；對方再次接受前，場次仍維持待協調。','寄出邀請'))return;button.disabled=true;try{const result=await api('requestOriginalResearcherAgain',sessionToken,id,message);await load();flash(`已請 ${result.researcherName} 再次確認。`)}catch(error){button.disabled=false;showError(error)}}));
        document.querySelectorAll('[data-sensitive]').forEach(b=>b.addEventListener('click',async()=>{try{const d=await api('getSensitiveApplication',sessionToken,b.dataset.sensitive);modal(`<h2>敏感資格資料</h2><p>身分證字號：<strong>${esc(d.nationalId||'未填')}</strong></p><p>檢查碼格式：${d.idValid==='true'?'通過':'需人工核對'}</p><p>戶籍地址：${esc(d.homeAddress||'未填')}</p><div class="notice">只用於管理者核對資格或重複報名，請勿複製到一般通知或研究者行程。</div><button class="btn" onclick="closeModal()">關閉</button>`)}catch(e){showError(e)}}));
        document.querySelectorAll('.response-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form),decision=d.get('decision');if(decision==='decline'&&(!d.get('reason')||!d.get('detail'))){showError(new Error('無法執行時，原因與補充說明都必須填寫。'));return}if(LINK_TOKEN)callAndReload('respondResearcher',LINK_TOKEN,decision,d.get('reason'),d.get('detail'));else callAndReload('respondResearcherInApp',form.dataset.response,decision,d.get('reason'),d.get('detail'))}));
      }
      if(view==='sessions')document.querySelectorAll('.session-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);callAndReload('updateAttendance',form.dataset.session,d.get('attendance'),d.has('result'),d.has('blacklist'),d.get('note'))}));
      if(view==='notes')$('#saveNote')?.addEventListener('click',()=>callAndReload('addOverallNote',{date:$('#noteDate').value,note:$('#noteText').value}));
      if(view==='researchers'){
        $('#researcherForm')?.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);callAndReload('addResearcher',{name:d.get('name'),email:d.get('email'),color:d.get('color')})});
        document.querySelectorAll('[data-remove-researcher]').forEach(button=>button.addEventListener('click',async()=>{if(!await confirmAction('移除研究者',`移除 ${button.dataset.name}？此操作會立即停用登入；若仍有已排實驗，系統會要求先完成協調。`,'移除研究者'))return;try{await api('removeResearcher',sessionToken,button.dataset.removeResearcher);await load();flash('研究者已停用，登入權限已撤銷。')}catch(err){showError(err)}}));
      }
      if(view==='settings'){
        $('#syncForm')?.addEventListener('click',()=>api('syncFormChoicesForAdmin',sessionToken).then(r=>{flash(`已同步：${r.openSlots} 個可報名時段；表單${r.formAccepting?'開放':'暫停'}收件。`);load()}).catch(showError));
        $('#addTemplateSlot')?.addEventListener('click',()=>{const rows=[...document.querySelectorAll('[data-template-start]')],index=rows.length;const row=document.createElement('div');row.className='template-row';row.innerHTML=`<strong>時段 ${index+1}</strong><label class="field"><span>開始</span><input type="text" inputmode="numeric" maxlength="5" placeholder="HH:mm" data-time-24h data-template-start="${index}" value=""></label><span class="template-end">結束：—</span><button class="btn small danger" type="button" data-template-remove="${index}">移除</button>`;$('#scheduleTemplateRows').appendChild(row);bindTemplateControls()});
        bindTemplateControls();
        $('#saveScheduleTemplate')?.addEventListener('click',async()=>{const starts=[...document.querySelectorAll('[data-template-start]')].map(input=>AvailabilityUI.normalizeTimeEntry(input.value));if(starts.some(start=>!AvailabilityUI.isValidTime24h(start))){showError(new Error('所有預設時段都需要填寫有效的 24 小時制開始時間，例如 09:30。'));return}try{await api('updateScheduleDefaults',sessionToken,{slots:starts.map(start=>[start,AvailabilityUI.addMinutesLabel(start,60)])});await load();flash('未來月份的預設時段已更新。')}catch(err){showError(err)}});
      }
    }
    function bindTemplateControls(){
      AvailabilityUI.bind24HourFields($('#scheduleTemplateRows'));
      document.querySelectorAll('[data-template-remove]').forEach(button=>{if(button.dataset.bound)return;button.dataset.bound='1';button.addEventListener('click',()=>{if(document.querySelectorAll('[data-template-start]').length<=1){showError(new Error('至少保留一個預設時段。'));return}button.closest('.template-row').remove();[...document.querySelectorAll('.template-row')].forEach((row,index)=>{row.querySelector('strong').textContent=`時段 ${index+1}`;row.querySelector('[data-template-start]').dataset.templateStart=index;row.querySelector('[data-template-remove]').dataset.templateRemove=index})})});
      document.querySelectorAll('[data-template-start]').forEach(input=>{if(input.dataset.bound)return;input.dataset.bound='1';input.addEventListener('blur',()=>{input.value=AvailabilityUI.normalizeTimeEntry(input.value);input.closest('.template-row').querySelector('.template-end').textContent='結束：'+(AvailabilityUI.addMinutesLabel(input.value,60)||'—')})});
    }

    async function renderResearcherAction(){
      $('#root').innerHTML=`<section class="panel auth compact-action"><h1>研究者確認</h1><div id="flash" class="alert" role="status" aria-live="polite">正在讀取場次…</div><div id="action"></div></section>`;
      try{
        const d=await api('requestResearcherAction',LINK_TOKEN);
        const context=d.support?'受邀支援此場次，請確認是否接受。':d.actionType==='reschedule'?'請確認受試者提出的新時段。':'請確認是否可執行此場次。';
        flash(context);
        $('#action').innerHTML=`<div class="ack-card researcher-action-card"><strong>${esc(d.participantName)}</strong><span class="ack-slot">${esc(d.slot)}</span>${d.managerMessage?`<p class="help">${esc(d.managerMessage)}</p>`:''}<form id="answer" class="compact-form"><fieldset class="researcher-choice"><legend class="sr-only">回覆場次安排</legend><label><input type="radio" name="decision" value="accept" required> 可以執行</label><label><input type="radio" name="decision" value="decline" required> 無法執行</label></fieldset><div id="researcherActionReasons" class="reason-fields" hidden><label class="field">原因<select name="reason"><option value="">請選擇</option><option>臨時有課／工作</option><option>設備或場地問題</option><option>身體狀況</option><option>其他</option></select></label><label class="field">補充說明<textarea name="detail" placeholder="請簡述原因"></textarea></label></div><div id="researcherActionError" class="alert error" role="alert" hidden></div><button class="btn primary" type="submit">送出回覆</button></form></div>`;
        $('#answer').addEventListener('submit',async e=>{
          e.preventDefault();const form=e.currentTarget,d=new FormData(form);
          const decline=d.get('decision')==='decline',reasons=$('#researcherActionReasons'),reason=form.elements.reason,detail=form.elements.detail,error=$('#researcherActionError');
          reasons.hidden=!decline;reason.required=decline;detail.required=decline;
          if(decline&&(!d.get('reason')||!d.get('detail'))){error.textContent='請填寫婉拒原因與補充說明。';error.hidden=false;return}
          error.hidden=true;
          try{await api('respondResearcher',LINK_TOKEN,d.get('decision'),d.get('reason'),d.get('detail'));$('#action').innerHTML='<div class="ack-card"><strong>已記錄你的回覆。</strong></div>';flash('已收到回覆。')}
          catch(err){error.textContent=err.message||String(err);error.hidden=false}
        });
        $('#answer').addEventListener('change',event=>{if(event.target.name!=='decision')return;const decline=event.target.value==='decline',reasons=$('#researcherActionReasons');reasons.hidden=!decline;$('#answer').elements.reason.required=decline;$('#answer').elements.detail.required=decline;$('#researcherActionError').hidden=true});
      }catch(error){showError(error)}
    }
    async function renderAck(){

    async function renderReschedule(){
      $('#root').innerHTML=`<section class="panel auth"><div class="eyebrow">RESCHEDULE REQUEST</div><h1>申請改期</h1><div id="flash" class="alert" role="status" aria-live="polite">正在讀取可選時段…</div><div id="action"></div></section>`;
      try{
        const d=await api('getRescheduleOptions',LINK_TOKEN);
        $('#flash').textContent=`${d.name}，目前預約：${d.currentSlot}。選擇的新時間會先保留，等研究者確認後才會替換原預約。`;
        $('#action').innerHTML=d.slots.length?`<form id="reschedule"><div class="field"><label>新實驗時段</label><select name="slot" required>${d.slots.map(s=>`<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('')}</select></div><button class="btn primary" type="submit">送出改期申請</button></form>`:'<div class="empty">目前沒有可選時段，請直接回覆錄取信與研究團隊聯絡。</div>';
        $('#reschedule')?.addEventListener('submit',async e=>{e.preventDefault();try{const result=await api('requestParticipantReschedule',LINK_TOKEN,new FormData(e.currentTarget).get('slot'));$('#action').textContent=result.message;flash('已收到改期申請；新時段待研究者確認，原時段仍保留。')}catch(error){showError(error)}});
      }catch(error){showError(error)}
    }
  </script>

</body>
</html>
