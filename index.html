<body>
  <div id="root"><section class="panel auth"><div class="eyebrow">RESEARCH DESK</div><h1>正在載入工作台…</h1><p class="subtitle">請留在此頁；連線較久時，系統會顯示目前狀態。</p></section></div>
  <div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
  <script>
  window.TimePicker24=(()=>{
    let outsidePointerHandlerBound=false;
    function isValidTime24h(time){return /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(String(time||''))}
    function normalizeTimeEntry(time){const value=String(time||'').trim();if(isValidTime24h(value))return value;const partial=value.match(/^((?:[01]\d|2[0-3])):([0-5])$/);if(partial)return partial[1]+':'+partial[2]+'0';const digits=value.replace(/\D/g,'');if(/^\d{3,4}$/.test(digits)){const normalized=digits.length===3?(digits[0]==='0'?digits.slice(0,2)+':'+digits[2]+'0':'0'+digits[0]+':'+digits.slice(1)):digits.slice(0,2)+':'+digits.slice(2);return isValidTime24h(normalized)?normalized:value}return value}
    function bind24HourFields(root=document){root.querySelectorAll('[data-time-24h]').forEach(input=>{
      if(input.dataset.timeBound)return;input.dataset.timeBound='1';input.type='text';input.inputMode='numeric';input.maxLength=5;input.placeholder='HH:mm';input.autocomplete='off';
      input.addEventListener('input',()=>{input.value=input.value.replace(/[^0-9:]/g,'').slice(0,5)});
      input.addEventListener('blur',()=>{const normalized=normalizeTimeEntry(input.value);if(normalized!==input.value){input.value=normalized;input.dispatchEvent(new Event('change',{bubbles:true}))}});
      const wheel=document.createElement('div');wheel.className='time-wheel-control';input.parentNode.insertBefore(wheel,input);wheel.appendChild(input);
      const trigger=document.createElement('button');trigger.type='button';trigger.className='time-wheel-trigger';trigger.setAttribute('aria-label','使用 24 小時制選擇時間');trigger.textContent='◷';trigger.disabled=input.disabled;wheel.appendChild(trigger);
      const popover=document.createElement('div');popover.className='time-wheel-popover';popover.hidden=true;
      const [initialHour='00',initialMinute='00']=(isValidTime24h(input.value)?input.value:'00:00').split(':');
      const column=(label,count,selected)=>`<label><span>${label}</span><select size="5" aria-label="${label}">${Array.from({length:count},(_,i)=>{const value=String(i).padStart(2,'0');return `<option value="${value}" ${value===selected?'selected':''}>${value}</option>`}).join('')}</select></label>`;
      popover.innerHTML=`${column('時',24,initialHour)}${column('分',60,initialMinute)}<button type="button" class="btn small">完成</button>`;wheel.appendChild(popover);
      const selects=[...popover.querySelectorAll('select')];
      const sync=()=>{if(selects[0].value&&selects[1].value){input.value=selects[0].value+':'+selects[1].value;input.dispatchEvent(new Event('input',{bubbles:true}))}};
      selects.forEach(select=>select.addEventListener('change',sync));
      trigger.addEventListener('click',()=>{popover.hidden=!popover.hidden;if(!popover.hidden){const [hour,minute]=(isValidTime24h(input.value)?input.value:'00:00').split(':');selects[0].value=hour;selects[1].value=minute;selects[0].focus()}});
      popover.querySelector('button').addEventListener('click',()=>{popover.hidden=true;input.dispatchEvent(new Event('change',{bubbles:true}));input.focus()});
    });if(!outsidePointerHandlerBound){document.addEventListener('pointerdown',event=>document.querySelectorAll('.time-wheel-popover:not([hidden])').forEach(popover=>{if(!popover.parentElement?.contains(event.target))popover.hidden=true}));outsidePointerHandlerBound=true}}
    function addMinutesLabel(time,minutes){if(!isValidTime24h(time))return '';const parts=String(time).split(':').map(Number),n=parts[0]*60+parts[1]+minutes;return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
    return Object.freeze({isValidTime24h,normalizeTimeEntry,bind24HourFields,addMinutesLabel});
  })();
</script>

  <script>
  window.AvailabilityUI=(()=>{
    const {isValidTime24h,normalizeTimeEntry,bind24HourFields,addMinutesLabel}=window.TimePicker24;
    function renderCalendarSyncNotice(canEditMonth,admin){
      if(!canEditMonth)return '';
      const researchers=(availabilityCalendarSyncMonth===calendarMonthKey(availabilityMonth)?availabilityCalendarSync?.researchers||[]:[]).filter(item=>admin||item.researcherId===state.user.researcherId);
      const failed=researchers.filter(item=>item.status?.status==='needs_attention');
      if(failed.length)return `<div class="alert error calendar-sync-state" role="alert"><span>日曆待處理：${failed.map(item=>esc(item.name||'研究者')).join('、')}</span>${failed.map(item=>`<button class="btn small" type="button" data-calendar-retry="${esc(item.researcherId)}">重試</button>`).join('')}</div>`;
      const pending=researchers.filter(item=>['pending','running','retry_scheduled'].includes(item.status?.status));
      if(pending.length)return `<div class="notice calendar-sync-state" role="status" aria-live="polite">研究日曆同步中${admin?` · ${pending.map(item=>esc(item.name||'研究者')).join('、')}`:''}</div>`;
      if(researchers.some(item=>item.status?.status==='synced'))return '<div class="tag green calendar-sync-state" role="status">研究日曆已同步</div>';
      return '<div class="meta calendar-sync-state" role="status">儲存班表後自動同步研究日曆</div>';
    }
    function renderAvailability(admin){
      if(availabilityLoading||availabilityLoadError){
        const status=availabilityLoading?`<div class="notice" role="status">正在載入 ${esc(calendarMonthTitle(availabilityMonth))} 班表…</div>`:`<div class="alert error" role="alert">${esc(availabilityLoadError)} <button class="btn small" id="retryAvailabilityMonth" type="button">重試</button></div>`;
        return `<section class="panel calendar-panel"><div class="panel-head"><div><h2>研究者可收時間</h2><p class="help">每個時段僅指派一位研究者；月曆會顯示全隊排班。</p></div></div>${calendarToolbar(availabilityMonth,'availability')}${status}</section>`;
      }
      const plan=availabilityPlan||{status:'collecting',slots:[],days:{},template:state.scheduleDefaults?.slots||defaultAvailabilitySlots,submittedBy:{}};
      const published=plan.status==='published';
      const editable=Boolean(plan.roster?.canEditDraft);
      const canEditMonth=Boolean(plan.roster?.canEditMonth);
      const slots=(plan.slots||[]).filter(s=>s.status!=='expired'&&s.status!=='closed').sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
      const pending=slots.filter(s=>s.status==='needs_assignment');
      const submitted=Boolean(plan.submittedBy&&plan.submittedBy[state.user.email]);
      const submittedCount=Object.keys(plan.submittedBy||{}).length;
      const renderSlot=s=>{
        const pendingSupport=s.status==='support_pending'&&s.researcherId===state.user.researcherId;
        const day=plan.days&&plan.days[s.date];
        const canAdjust=editable&&state.user.researcherId&&day?.mode!=='custom'&&s.researcherId===state.user.researcherId&&['draft_available','available'].includes(s.status)&&!s.locked;
        const status=s.status==='support_pending'?'待回覆支援':s.status==='draft_available'?'草稿，未發布':s.status==='available'?'可報名':s.status==='booked'?'已報名':s.status==='needs_assignment'?'待認領':s.status;
        const time=canAdjust
          ?`<button class="calendar-time-adjust" type="button" data-adjust-slot="${esc(s.slotId)}" data-adjust-date="${esc(s.date)}" aria-label="調整 ${esc(s.date)} ${esc(s.start)} 時段"><strong>${esc(s.start)}–${esc(s.end)}</strong><span>調整時間</span></button>`
          :`<span class="calendar-event-time"><strong>${esc(s.start)}–${esc(s.end)}</strong></span>`;
        const eventTag=canEditMonth?'button':'div',eventAttrs=canEditMonth?` type="button" data-day-open="${esc(s.date)}" aria-label="開啟 ${esc(s.date)} 班表編輯"`:'';
        const capacity=s.capacitySummary;
        const capacityMeta=capacity?`<span class="slot-capacity-summary">${Number(capacity.occupiedCount)||0}/${Number(capacity.capacity)||1} 名額 · 剩 ${Number(capacity.remainingCount)||0}</span>`:'';
        const capacityAction=admin&&published&&canEditMonth&&capacity?`<button class="btn small slot-capacity-action" type="button" data-slot-capacity="${esc(s.slotId)}">設定名額</button>`:'';
        return `<div class="calendar-event ${s.status==='booked'?'booked':''} ${s.supportRequest?'requested':''}" style="--person:${esc(s.color)}">${time}<${eventTag} class="calendar-event-main ${canEditMonth?'':'readonly'}"${eventAttrs}><span class="calendar-event-name">${esc(s.researcherName||'待認領')}</span><span class="tag ${s.status==='available'?'green':s.status==='booked'?'red':'amber'}">${esc(status)}</span></${eventTag}>${capacityMeta}${capacityAction}${pendingSupport&&canEditMonth?`<div class="support-actions"><button class="btn small" data-schedule-support="accept" data-date="${esc(s.date)}" data-slot="${esc(s.slotId)}">接受</button><button class="btn small danger" data-schedule-support="decline" data-date="${esc(s.date)}" data-slot="${esc(s.slotId)}">婉拒</button></div>`:''}</div>`;
      };
      const renderItem=s=>renderSlot(s);
      const rosterMonthLabel=calendarMonthTitle(calendarMonthDate(plan.month||calendarMonthKey(availabilityMonth)))+'班表';
      const phaseLabel=plan.roster?.phase==='researcher_fill'?'開放填寫中':plan.roster?.phase==='manager_review'?'管理者檢查中':plan.roster?.phase==='publish_day'?'管理者發布日':plan.roster?.phase==='late_review'?'待管理者發布':'本月排班';
      const readOnlyReason=()=>{const roster=plan.roster||{},month=String(plan.month||'');if(roster.currentMonth&&month<roster.currentMonth)return '這是過去月份，排班僅供查看。';if(roster.nextMonth&&month>roster.nextMonth)return `目前只開放本月與下個月；${roster.nextMonth}之後的月份尚未開放。`;if(roster.nextMonth&&month===roster.nextMonth&&Number(roster.day)<20&&!published)return '下月排班將於每月 20 日開放填寫。';return '此月份目前僅供查看。'};
      const workflow=published
        ?`<div class="roster-actions"><div><strong>已發布班表${canEditMonth?' · 可微調':' · 僅供查看'}</strong><div class="help">${canEditMonth?`${admin?'管理者可調整未鎖定時段':'研究者可調整或取消自己的未報名時段'}；已報名場次請用臨時異動。`:''}${canEditMonth&&plan.publishedAt?' ':''}${canEditMonth&&plan.publishedAt?`發布時間：${esc(plan.publishedAt)}`:readOnlyReason()}</div></div><div class="actions"><span class="tag green">已發布</span></div></div>`
        :!editable
        ?`<div class="roster-actions"><div><strong>此月份僅供查看</strong><div class="help">${esc(readOnlyReason())}</div></div><span class="tag">僅供查看</span></div>`
        :admin
        ?`<div class="roster-actions"><div><strong>${rosterMonthLabel} · ${phaseLabel}</strong><div class="help">已送出 ${submittedCount} 位研究者的班表；發布前仍可修改。管理者於 28 日一次發布整月班表。</div></div><div class="actions"><button class="btn" id="submitMyMonth">${submitted?'本人已送出':'標記本人班表完成'}</button>${plan.roster?.canPublishDraft?'<button class="btn primary" id="publishMonth">發布班表並同步報名表</button>':''}</div></div>`
        :`<div class="roster-actions"><div><strong>${rosterMonthLabel} · ${submitted?'已送出':'開放填寫'}</strong><div class="help">${submitted?'發布前仍可修改。':'本月可隨時調整；下月班表於每月 20 日開放，管理者 28 日發布。'}</div></div><div class="actions"><button class="btn primary" id="submitMonth">${submitted?'再次通知管理者':'送出班表進度'}</button></div></div>`;
      const help=plan.status==='published'
        ?'已發布後，研究者可微調或取消自己尚未有人報名的時段；一般時段固定 1 小時，儲存後結束時間自動計算。管理者可調整所有未報名時段或新增時段。已報名場次請使用臨時異動流程。'
        :admin
        ?'未發布前只有月曆草稿會更新。按「發布班表並同步報名表」後，系統才會更新可報名選項；每個時段只會有一位研究者。'
        :'月曆顯示整個團隊的班表。你只能勾選或移動自己的時段；若後續時段已由其他研究者填寫，系統會擋下會影響對方的調整。';
      return `<section class="panel calendar-panel"><div class="panel-head"><div><h2>研究者可收時間</h2><p class="help">本月可持續調整；每月 20 日開放填寫下月班表。儲存後自動更新研究日曆。</p></div></div>${calendarToolbar(availabilityMonth,'availability')}${workflow}${renderCalendarSyncNotice(canEditMonth,admin)}<div class="calendar-scroll"><div class="calendar-weekdays">${['星期日','星期一','星期二','星期三','星期四','星期五','星期六'].map(d=>`<div>${d}</div>`).join('')}</div><div class="calendar-grid">${renderMonthGrid(availabilityMonth,slots,renderItem,canEditMonth)}</div></div><div class="notice calendar-section-note">${!canEditMonth?readOnlyReason():help}${published?'':' 草稿不會進入報名表。'}</div></section>${admin&&pending.length&&canEditMonth?`<section class="panel"><h2>待認領時段</h2>${pending.map(s=>`<div class="slotline"><strong>${esc(s.date)}　${esc(s.start)}–${esc(s.end)}</strong><div class="meta">尚未認領，發布前請指派或調整。</div></div>`).join('')}</section>`:''}`;
    }
    function normalizeStoredSlotTimes(slots){return (slots||[]).map(slot=>{const start=normalizeTimeEntry(slot.start),end=normalizeTimeEntry(slot.end);return Object.assign({},slot,{start:isValidTime24h(start)?start:String(slot.start||''),end:isValidTime24h(end)?end:String(slot.end||'')})})}

    async function openSlotCapacityManager(slotId){
      if(state.user.role!=='admin')return;
      const slot=(availabilityPlan?.slots||[]).find(item=>String(item.slotId)===String(slotId));
      if(!slot||!slot.capacitySummary)return showError(new Error('找不到這個場次的名額資料，請重新整理。'));
      const summary=slot.capacitySummary,apps=await api('getSlotCapacityCasesForAdmin',sessionToken,slotId);
      const statusName={review:'待管理者審核',researcher_pending:'等研究者確認',needs_coordination:'待協調',confirmed:'已確認',completed:'已完成',no_show:'未到',reschedule_pending:'改期處理中'};
      const caseRows=apps.map(app=>{
        const target=Boolean(app.isProposedSlot);
        const status=target?'改期保留':app.status==='reschedule_pending'?'原場次 · 改期處理中':statusName[app.status]||app.status;
        const bookingStatus=app.bookingStatus==='held'?'暫留名額':'確認名額';
        return `<div class="slot-capacity-case"><span><strong>${esc(app.name)}</strong><small>${esc(bookingStatus)} · ${esc(status)}${app.researcherName?' · '+esc(app.researcherName):''}</small></span>${!target&&app.bookingStatus==='confirmed'&&app.status==='confirmed'?`<button class="btn small danger" type="button" data-capacity-cancel="${esc(app.applicationId)}">取消此人</button>`:''}</div>`;
      }).join('')||'<div class="empty compact-empty">目前沒有占用席位</div>';
      const editor=`<div class="slot-capacity-editor"><label for="slotCapacityValue">此場名額</label><div class="slot-capacity-controls"><input id="slotCapacityValue" type="number" min="1" step="1" value="${Number(summary.capacity)||1}" inputmode="numeric"><button class="btn primary" id="saveSlotCapacity" type="button">儲存</button></div><small class="help">目前占用 ${Number(summary.occupiedCount)||0} 席（確認 ${Number(summary.confirmedCount)||0}、暫留 ${Number(summary.heldCount)||0}）；名額不能低於占用數。</small></div>`;
      modal(`<div class="panel-head"><div><div class="eyebrow">場次名額</div><h2>${esc(slot.date)}　${esc(slot.start)}–${esc(slot.end)}</h2><div class="meta">${esc(slot.researcherName||'待認領')}</div></div><button class="btn small" type="button" id="closeSlotCapacity">關閉</button></div>${editor}<section class="slot-capacity-cases"><h3>占用席位</h3>${caseRows}</section>`);
      $('#closeSlotCapacity').addEventListener('click',closeModal);
      $('#saveSlotCapacity').addEventListener('click',async event=>{
        const button=event.currentTarget,input=$('#slotCapacityValue'),value=String(input.value||'').trim();
        if(!/^\d+$/.test(value)||Number(value)<1){showError(new Error('名額請輸入大於 0 的整數。'));return}
        button.disabled=true;button.textContent='儲存中…';
        try{
          const result=await api('setSlotCapacityForAdmin',sessionToken,slotId,Number(value));
          closeModal();await refreshAfterMutation();
          flash(result.formSyncPending?'名額已更新；報名表同步待重試。':`名額已更新：占用 ${result.occupiedCount} / ${result.capacity}，剩餘 ${result.remainingCount}。`);
        }catch(error){button.disabled=false;button.textContent='儲存';showError(error)}
      });
      document.querySelectorAll('[data-capacity-cancel]').forEach(button=>button.addEventListener('click',async()=>{
        const reason=await askForReason('取消此受試者場次','只取消這位受試者並釋出一個名額；同場其他人不受影響。請填寫原因。','例如：受試者通知無法出席');
        if(!reason||!await confirmAction('確認取消','取消此受試者的場次並寄出通知？','取消此人'))return;
        button.disabled=true;try{const result=await api('cancelConfirmedApplication',sessionToken,button.dataset.capacityCancel,reason);closeModal();await refreshAfterMutation();flash(result.message)}catch(error){button.disabled=false;showError(error)}
      }));
    }

    function openPublishedAvailabilityEditor(date,admin){
      const day=availabilityPlan.days?.[date]||{mode:availabilityPlan.mode||'standard',lunchBreak:true,slots:[]},myId=state.user.researcherId||'';
      const slots=normalizeStoredSlotTimes(day.slots).sort((a,b)=>String(a.start).localeCompare(String(b.start)));
      let working=slots.map(s=>Object.assign({},s)),workingLunch=day.lunchBreak!==false;
      const scheduleEdits=[];
      const protectedSlot=s=>Boolean(s.locked)||Boolean(s.applicationId)||['held','booked','completed','reschedule_hold'].includes(s.status);

        try{event.source.postMessage({type:'research-desk:ready-ack',channel:bridgeChannel},event.origin)}catch(_){return}
        if(!bridgeReadyResolve)return;
        console.info('[研究工作台效能] bridge ready',Math.round(performance.now()-bridgeStartedAt)+' ms');
        clearTimeout(bridgeReadyTimer);bridgeReadyTimer=null;
        if(bridgeReadyResolve){bridgeReadyResolve();bridgeReadyResolve=null;bridgeReadyReject=null}
        return;
      }
      if(event.source!==bridgeSource||event.origin!==bridgeOrigin||message.type!=='research-desk:result')return;
      const pending=bridgeRequests.get(message.id);if(!pending)return;
      clearTimeout(pending.timer);bridgeRequests.delete(message.id);
      message.ok?pending.resolve(message.value):pending.reject(bridgeError(message.error));
    });
    function connectBridge(){
      if(window.google&&window.google.script&&window.google.script.run)return Promise.resolve();
      if(bridgeReady)return bridgeReady;
      if(!BACKEND_URL)return Promise.reject(bridgeError('尚未設定 Apps Script 後端網址。'));
      bridgeChannel=createBridgeChannel();
      bridgeStartedAt=performance.now();
      bridgeFrameLoadCount=0;
      bridgeReady=new Promise((resolve,reject)=>{
        bridgeReadyResolve=resolve;bridgeReadyReject=reject;
        bridgeReadyTimer=setTimeout(()=>{
          console.warn('[研究工作台效能] bridge ready timeout',JSON.stringify({elapsedMs:Math.round(performance.now()-bridgeStartedAt),frameLoads:bridgeFrameLoadCount}));
          bridgeReadyReject&&bridgeReadyReject(bridgeError('Apps Script 連線逾時，請稍後重試。'));
        },30000);
        const frame=document.createElement('iframe');
        bridgeFrame=frame;frame.title='安全連接研究工作台';frame.setAttribute('aria-hidden','true');
        frame.style.cssText='position:absolute;width:1px;height:1px;left:-10000px;border:0';
        frame.addEventListener('load',()=>{bridgeFrameLoadCount++;console.info('[研究工作台效能] bridge frame load',JSON.stringify({elapsedMs:Math.round(performance.now()-bridgeStartedAt),frameLoads:bridgeFrameLoadCount}))});
        frame.addEventListener('error',()=>bridgeReadyReject&&bridgeReadyReject(bridgeError('Apps Script 連線失敗，請稍後重試。')),{once:true});
        const params=new URLSearchParams({bridge:'1',parentOrigin:location.origin,channel:bridgeChannel});
        frame.src=BACKEND_URL+'?'+params.toString();
        document.body.appendChild(frame);
      }).catch(error=>{
        clearTimeout(bridgeReadyTimer);bridgeReadyTimer=null;
        bridgeReadyResolve=null;bridgeReadyReject=null;bridgeOrigin='';bridgeSource=null;
        if(bridgeFrame){bridgeFrame.remove();bridgeFrame=null}
        bridgeReady=null;
        throw error;
      });
      return bridgeReady;
    }
    function bridgeApi(name,args){
      return connectBridge().then(()=>{
        const requestStarted=performance.now();
        return new Promise((resolve,reject)=>{
        const id='rpc-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
        const timer=setTimeout(()=>{bridgeRequests.delete(id);reject(bridgeError('後端沒有在期限內回覆，請重試。'))},60000);
        bridgeRequests.set(id,{resolve,reject,timer});
        if(!bridgeOrigin||!bridgeSource){clearTimeout(timer);bridgeRequests.delete(id);reject(bridgeError('Apps Script 連線尚未完成，請重試。'));return}
        bridgeSource.postMessage({type:'research-desk:rpc',channel:bridgeChannel,id,method:name,args},bridgeOrigin);
        }).finally(()=>console.info('[研究工作台效能] bridge RPC '+name,Math.round(performance.now()-requestStarted)+' ms'));
      });
    }
    function rawApi(name,args){
      return window.google&&window.google.script&&window.google.script.run
        ?new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(bridgeError(e&&e.message?e.message:String(e))));runner.dispatchApi(name,args)})
        :bridgeApi(name,args);
    }
    function api(name,...args){
      const isWrite=WRITE_METHODS.has(name),start=performance.now();
      if(isWrite&&activeWriteKey)return Promise.reject(new Error('上一項操作仍在處理，請稍候；完成前不需要再按一次。'));
      const requestEpoch=authEpoch;
      const requestStudyEpoch=studyEpoch,requestStudyId=activeStudyId;
      let writeSequence=0;
      if(isWrite){
        lastWriteOutcome=null;clearTimeout(writeOutcomeClearTimer);writeOutcomeClearTimer=null;
        writeSequence=++activeWriteSequence;
        activeWriteKey=name;
        const focused=document.activeElement,form=focused?.form;
        activeWriteControl=focused?.matches?.('button,[type="submit"]')?focused:form?.querySelector?.('[type="submit"]')||null;
        if(activeWriteControl){activeWriteControl.dataset.requestOriginalHtml=activeWriteControl.innerHTML;activeWriteControl.dataset.requestOriginalDisabled=String(activeWriteControl.disabled);activeWriteControl.disabled=true;activeWriteControl.innerHTML=`<span class="button-spinner" aria-hidden="true"></span>${esc(WRITE_MESSAGES[name]||'處理中…')}`}
        document.documentElement.classList.add('request-pending');
        setRequestStatus(WRITE_MESSAGES[name]||'正在送出，請稍候…');
      }
      const centralMethods=new Set(['requestLoginCode','verifyLoginCode','getAccessibleStudies','getStudyOnboarding','inspectStudyForm','inspectStudyHistorySource','previewStudyHistoryImport','saveStudyDraft','activateStudyDraft','logout']);
      const requestArgs=args.slice();
      if(!centralMethods.has(name)&&activeStudyId)requestArgs.push({__studyId:activeStudyId});
      return rawApi(name,requestArgs).then(value=>{
        if(requestEpoch!==authEpoch){const stale=new Error('工作階段已切換，忽略舊請求回應。');stale.code='STALE_SESSION_RESPONSE';throw stale}
        if(!centralMethods.has(name)&&(requestStudyEpoch!==studyEpoch||requestStudyId!==activeStudyId)){const stale=new Error('實驗已切換，忽略舊請求回應。');stale.code='STALE_STUDY_RESPONSE';throw stale}
        if(isWrite&&value&&value.saved===true){
          lastWriteOutcome={saved:true,formSyncPending:Boolean(value.formSyncPending),sideEffectsQueued:Number(value.sideEffectsQueued||0),calendarSyncQueued:Number(value.calendarSyncQueued||0),at:Date.now()};
          writeOutcomeClearTimer=setTimeout(()=>{lastWriteOutcome=null;writeOutcomeClearTimer=null},45000);
        }
        if(isWrite&&document.querySelector('#flash'))setRequestStatus('已收到回應，正在更新畫面…');
        return value;
      }).catch(error=>{
        if(requestEpoch!==authEpoch){const stale=new Error('工作階段已切換，忽略舊請求結果。');stale.code='STALE_SESSION_RESPONSE';throw stale}
        if(!centralMethods.has(name)&&(requestStudyEpoch!==studyEpoch||requestStudyId!==activeStudyId)){const stale=new Error('實驗已切換，忽略舊請求結果。');stale.code='STALE_STUDY_RESPONSE';throw stale}
        throw error;
      }).finally(()=>{
        const elapsed=Math.round(performance.now()-start);
        console.info('[研究工作台效能]',name,elapsed+' ms');
        if(isWrite&&activeWriteSequence===writeSequence){
          if(activeWriteControl?.isConnected){activeWriteControl.innerHTML=activeWriteControl.dataset.requestOriginalHtml||activeWriteControl.textContent;activeWriteControl.disabled=activeWriteControl.dataset.requestOriginalDisabled==='true';delete activeWriteControl.dataset.requestOriginalHtml;delete activeWriteControl.dataset.requestOriginalDisabled}
          activeWriteControl=null;activeWriteKey='';document.documentElement.classList.remove('request-pending');
        }
      });
    }
</script>

    function bind(view) {

        });
      }
    }

    return {renderSessions, renderNotes, bind};
  })();

    function renderMonthGrid(month,items,renderItem,addButton){

    function studyWizardDefaultMapping(schema){

      const name=find(/姓名|名字/,['TEXT']),identity=find(/身分證|身份證|身分證字號|身份證字號/,['TEXT']);
      const slot=find(/方便時段|報名時段|場次|時段/,['MULTIPLE_CHOICE','LIST']);
      const used=new Set([name?.itemId,identity?.itemId,slot?.itemId].filter(Boolean));
      const email=find(/電子郵件|Email|E-mail|信箱/,['TEXT']);
      return {formId:schema.formId,fields:{name:name?.itemId||'',identity:identity?.itemId||'',slot:slot?.itemId||'',email:schema.respondentEmailCollected===true?{source:'respondent'}:{source:'item',itemId:email?.itemId||''}}};
    }

  <script>

    async function renderReschedule(){

<script>
    const query = new URLSearchParams(location.search);
    const MODE = query.get('action') || 'login';
    const LINK_TOKEN = query.get('t') || '';
    const STUDY_PARAM = query.get('study') || '';
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbyhnV-8OJxQehl_I-21Hnvi1wTbN_gu6NdDlzOHvvEsXasfEzUDMQ3JSRY7SIPhfiEL0w/exec";
    const AvailabilityUI = window.AvailabilityUI;
    function readSessionToken(){try{return window.sessionStorage.getItem('mt-session')||''}catch(_){return ''}}
    function readStudyId(){try{return window.sessionStorage.getItem('mt-study')||''}catch(_){return ''}}
    function saveSessionToken(value){try{window.sessionStorage.setItem('mt-session',value)}catch(_){}}
    function saveStudyId(value){try{if(value)window.sessionStorage.setItem('mt-study',value);else window.sessionStorage.removeItem('mt-study')}catch(_){}}
    function clearSessionToken(){try{window.sessionStorage.removeItem('mt-session')}catch(_){}}
    let activeStudyId=STUDY_PARAM||readStudyId();
    let availableStudies=[];
    let canCreateStudies=false;
    let onboardingData=null;
    let onboardingWizard=null;
    function resetSessionState(){
      authEpoch++;studyEpoch++;authFlowSequence++;bootstrapRequestSequence++;availabilityRequestSequence++;
      lastWriteOutcome=null;clearTimeout(writeOutcomeClearTimer);writeOutcomeClearTimer=null;
      clearSessionToken();saveStudyId('');activeStudyId='';availableStudies=[];canCreateStudies=false;onboardingData=null;onboardingWizard=null;clearTimeout(initialLoadHintTimer);initialLoadHintTimer=null;
      clearTimeout(calendarSyncPollTimer);calendarSyncPollTimer=null;calendarSyncPollCount=0;
      if(activeWriteControl?.isConnected){activeWriteControl.innerHTML=activeWriteControl.dataset.requestOriginalHtml||activeWriteControl.textContent;activeWriteControl.disabled=activeWriteControl.dataset.requestOriginalDisabled==='true'}
      activeWriteControl=null;activeWriteKey='';activeWriteSequence++;document.documentElement.classList.remove('request-pending');
      const staleError=new Error('工作階段已切換。');staleError.code='STALE_SESSION_RESPONSE';
      bridgeRequests.forEach(pending=>{clearTimeout(pending.timer);pending.reject(staleError)});bridgeRequests.clear();
      while(dialogStack.length){const pending=dialogStack[dialogStack.length-1];pending.finish(pending.cancelValue)}
      closeModal();sessionToken='';state=null;availabilityPlan=null;availabilityCalendarSync=null;availabilityCalendarSyncMonth='';
      availabilityMonth=null;availabilityMonthCache=new Map();availabilityLoading=false;availabilityLoadError='';activeView='dashboard';stateRefreshPending=false;appointmentMonth=new Date();
    }
    let initialLoadHintTimer=null;
    let sessionToken = readSessionToken();
    let authEpoch = 0;
    let studyEpoch = 0;
    let state = null;
    let availabilityPlan = null;
    let availabilityCalendarSync = null;
    let availabilityCalendarSyncMonth = '';
    let calendarSyncPollTimer = null;
    let calendarSyncPollCount = 0;
    let authFlowSequence = 0;
    let activeView = 'dashboard';
    let availabilityMonth = null;
    let availabilityRequestSequence = 0;
    let bootstrapRequestSequence = 0;
    let availabilityMonthCache = new Map();
    let availabilityLoading = false;
    let availabilityLoadError = '';
    let stateRefreshPending = false;
    let appointmentMonth = new Date();
    const defaultAvailabilitySlots = [['09:30','10:30'],['11:00','12:00'],['13:00','14:00'],['14:30','15:30'],['16:00','17:00'],['17:30','18:30']];
    const $ = s => document.querySelector(s);
    const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function callAndReload(fn,...args){const token=sessionToken,epoch=authEpoch,studyVersion=studyEpoch,studyId=activeStudyId;return api(fn,token,...args).then(value=>{if(epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return null;return load().then(()=>{if(epoch===authEpoch&&studyVersion===studyEpoch&&studyId===activeStudyId&&token===sessionToken)flash(value?.message||'已儲存。')})}).catch(showError)}
    $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

    if(MODE==='researcher') renderResearcherAction();
    else if(MODE==='ack') renderAck();
    else if(MODE==='reschedule') renderReschedule();
    else if(sessionToken) load(); else renderLogin();

    function renderLogin(){
      const testEnvironment=window.RESEARCH_DESK_ENVIRONMENT==='test';
      $('#root').innerHTML=`<div class="wrap"><header class="header"><div class="brand">動作與思考研究<small>RESEARCH DESK${testEnvironment?' · TEST':''}</small></div>${testEnvironment?'<span class="pill">測試環境</span>':''}</header><section class="panel auth"><div class="eyebrow">SECURE SIGN IN</div><h1>登入研究工作台</h1><p class="subtitle">使用已加入團隊的 Google 信箱收取一次性驗證碼。研究者只能查看自己的案件與行程。</p><div id="flash" class="alert" hidden></div><form id="loginForm"><div class="field"><label for="email">團隊電子郵件</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><button class="btn primary" type="submit">寄送登入驗證碼</button></form><form id="verifyForm" hidden><div class="field"><label for="code">6 位驗證碼</label><input id="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="6"></div><div class="actions"><button class="btn primary" type="submit">驗證並登入</button><button class="btn" type="button" id="backLogin">返回</button></div></form><div class="footer">身分證字號與戶籍地址僅管理者可在權限頁查看。</div></section></div>`;
      let loginEmail='',requestPending=false,verifyPending=false,loginComplete=false;
      const flowId=++authFlowSequence;
      const clearLoginError=()=>{const n=$('#flash');if(n){n.hidden=true;n.classList.remove('error');n.textContent=''}};
      $('#loginForm').addEventListener('submit',async e=>{
        e.preventDefault();
        if(requestPending||loginComplete)return;
        requestPending=true;clearLoginError();
        const button=$('#loginForm button[type="submit"]');
        button.disabled=true;button.textContent='寄送中…';
        try{
          loginEmail=$('#email').value.trim();
          await api('requestLoginCode',loginEmail);
          if(flowId!==authFlowSequence||loginComplete)return;
          $('#loginForm').hidden=true;$('#verifyForm').hidden=false;flash('已寄出驗證碼，請查看該信箱。');
        }catch(err){if(flowId===authFlowSequence&&!loginComplete)showError(err)}
        finally{
          requestPending=false;
          if(flowId===authFlowSequence){const current=$('#loginForm button[type="submit"]');if(current){current.disabled=false;current.textContent='寄送登入驗證碼'}}
        }
      });
      $('#verifyForm').addEventListener('submit',async e=>{
        e.preventDefault();
        if(verifyPending||loginComplete)return;
        verifyPending=true;clearLoginError();
        const button=$('#verifyForm button[type="submit"]'),codeInput=$('#code');
        button.disabled=true;button.textContent='驗證中…';codeInput.disabled=true;
        try{
          const result=await api('verifyLoginCode',loginEmail,codeInput.value.trim());
          if(flowId!==authFlowSequence||loginComplete)return;
          loginComplete=true;resetSessionState();sessionToken=result.token;saveSessionToken(sessionToken);availableStudies=result.studies||[];await load();
        }catch(err){if(flowId===authFlowSequence&&!loginComplete)showError(err)}
        finally{
          verifyPending=false;
          if(flowId===authFlowSequence&&!loginComplete){const current=$('#verifyForm button[type="submit"]'),input=$('#code');if(current){current.disabled=false;current.textContent='驗證並登入'}if(input)input.disabled=false}
        }
      });
      $('#backLogin').addEventListener('click',()=>{if(requestPending||verifyPending)return;clearLoginError();$('#verifyForm').hidden=true;$('#loginForm').hidden=false});
    }

    function isSessionError(error){return Boolean(error&&['SESSION_EXPIRED','ACCOUNT_INACTIVE'].includes(error.code))}
    function renderLoadError(error){$('#root').innerHTML=`<section class="panel auth"><div class="eyebrow">RESEARCH DESK · CONNECTION</div><h1>工作台暫時無法載入</h1><p class="alert error">${esc(error&&error.message||error||'連線失敗')}</p><p class="subtitle" id="loadStatus">按重新載入後請留在此頁，避免重複送出。</p><button class="btn primary" id="retryLoad">重新載入</button></section>`;$('#retryLoad').addEventListener('click',event=>{const button=event.currentTarget;button.disabled=true;button.textContent='正在重新連線…';const status=$('#loadStatus');if(status)status.textContent='正在重新連線，請留在此頁，無需再次點擊。';load()})}
    function renderStudyPicker(studies){
      const options=(studies||[]).filter(study=>study&&study.studyId);
      if(!options.length){$('#root').innerHTML=`<section class="panel auth"><div class="eyebrow">RESEARCH DESK</div><h1>目前沒有可使用的實驗</h1><p class="subtitle">${canCreateStudies?'建立第一個實驗，或先登出。':'請聯絡系統管理者，將你的帳號加入實驗團隊。'}</p>${canCreateStudies?'<button class="btn primary" id="pickerCreateStudy">建立新實驗</button> ':''}<button class="btn" id="pickerLogout">登出</button></section>`;$('#pickerCreateStudy')?.addEventListener('click',openStudyOnboardingFromPicker);$('#pickerLogout').addEventListener('click',()=>{const token=sessionToken;resetSessionState();renderLogin();if(token)rawApi('logout',[token]).catch(()=>{})});return}
      $('#root').innerHTML=`<div class="wrap"><header class="header"><div class="brand">動作與思考研究<small>RESEARCH DESK</small></div><button class="btn small" id="pickerLogout">登出</button></header><section class="panel auth"><div class="eyebrow">SELECT A STUDY</div><h1>選擇實驗</h1><p class="subtitle">每個實驗的案件與研究者權限分開管理。</p><div class="study-options">${options.map(study=>`<button class="study-option" data-study="${esc(study.studyId)}"><strong>${esc(study.name)}</strong><span>${esc(study.role==='researcher'?'研究者':study.role==='admin_researcher'?'管理者／研究者':'管理者')}</span></button>`).join('')}</div></section></div>`;
      document.querySelectorAll('[data-study]').forEach(button=>button.addEventListener('click',()=>switchStudy(button.dataset.study)));
      $('#pickerLogout').addEventListener('click',()=>{const token=sessionToken;resetSessionState();renderLogin();if(token)rawApi('logout',[token]).catch(()=>{})});
    }
    function switchStudy(studyId){
      if(!availableStudies.some(study=>study.studyId===studyId))return;
      if(activeWriteKey){const picker=$('#studySwitcher');if(picker)picker.value=activeStudyId;showError(new Error('目前有寫入操作正在處理，完成後再切換實驗。'));return}
      if(studyId===activeStudyId)return;
      studyEpoch++;bootstrapRequestSequence++;availabilityRequestSequence++;
      activeStudyId=studyId;saveStudyId(studyId);state=null;availabilityPlan=null;availabilityCalendarSync=null;availabilityCalendarSyncMonth='';
      availabilityMonth=null;availabilityMonthCache=new Map();availabilityLoading=false;availabilityLoadError='';activeView='dashboard';stateRefreshPending=false;
      load();
    }
    async function load(){
      if(!sessionToken)return;
      const token=sessionToken,epoch=authEpoch,studyVersion=studyEpoch;
      let studyId=activeStudyId;
      const requestId=++bootstrapRequestSequence,started=performance.now();
      clearTimeout(initialLoadHintTimer);
      if(!state)initialLoadHintTimer=setTimeout(()=>{
        if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||state)return;
        const status=$('#loadStatus')||$('#root .subtitle');
        if(status)status.textContent='連線時間較長，仍在載入工作台；請留在此頁，無需重新整理。';
      },8000);
      if(state){draw();setRequestStatus('正在更新工作台資料…')}
      try{
        const available=await api('getAccessibleStudies',token);
        if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return;
        availableStudies=Array.isArray(available&&available.studies)?available.studies:[];
        canCreateStudies=Boolean(available&&available.canCreateStudies);
        if(!activeStudyId||!availableStudies.some(study=>study.studyId===activeStudyId)){
          if(availableStudies.length===1){activeStudyId=availableStudies[0].studyId;studyId=activeStudyId;saveStudyId(activeStudyId)}
          else {state=null;renderStudyPicker(availableStudies);return}
        }
        const nextState=await api('getBootstrap',token);
        if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return;
        if(activeView==='researchers'&&nextState.user.role==='admin'){
          nextState.teamMembers=await api('getStudyMembers',token,true);
          if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return;
        }
        nextState.availableStudies=availableStudies;
        nextState.canCreateStudies=canCreateStudies;
        state=nextState;
        stateRefreshPending=false;
        if(!availabilityMonth)availabilityMonth=calendarMonthDate(state.scheduleCycle?.currentMonth||calendarMonthKey(new Date()));
        draw();
        if(activeView==='availability')await loadAvailabilityMonth({force:true});
        if(state.user.role==='admin')loadAdminMailRelaySummary(token,state,epoch);
      }catch(error){
        if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return;
        if(error&&error.code==='STUDY_ACCESS_DENIED'){
          try{
            const available=await api('getAccessibleStudies',token);
            if(requestId!==bootstrapRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken)return;
            availableStudies=Array.isArray(available&&available.studies)?available.studies:[];
            canCreateStudies=Boolean(available&&available.canCreateStudies);
            if(!availableStudies.some(study=>study.studyId===studyId)){
              activeStudyId='';saveStudyId('');state=null;renderStudyPicker(availableStudies);return;
            }
          }catch(refreshError){if(refreshError&&['SESSION_EXPIRED','ACCOUNT_INACTIVE'].includes(refreshError.code))error=refreshError}
        }
        if(isSessionError(error)){resetSessionState();renderLogin();showError(error);rawApi('logout',[token]).catch(()=>{});return}
        if(state){draw();showError(error)}else renderLoadError(error);
      }finally{
        if(requestId===bootstrapRequestSequence){clearTimeout(initialLoadHintTimer);initialLoadHintTimer=null}
        console.info('[研究工作台效能] load',Math.round(performance.now()-started)+' ms');
      }
    }
    async function loadAdminMailRelaySummary(token,targetState,epoch){
      try{
        const summary=await api('getAdminMailRelaySummary',token);
        if(state!==targetState||epoch!==authEpoch||token!==sessionToken)return;
        state.mailRelay=summary;
        if(activeView==='dashboard')draw();
      }catch(error){
        console.warn('[研究工作台效能] 管理者寄件狀態載入失敗',String(error&&error.message||error));
      }
    }
    function calendarMonthKey(month){return `${month.getFullYear()}-${String(month.getMonth()+1).padStart(2,'0')}`}
    function calendarMonthDate(key){const [year,month]=String(key).split('-').map(Number);return new Date(year,month-1,1)}
    async function loadAvailabilityMonth(options={}){
      if(!state||!sessionToken||!availabilityMonth)return;
      const token=sessionToken,epoch=authEpoch,studyVersion=studyEpoch,studyId=activeStudyId;
      const monthKey=calendarMonthKey(availabilityMonth),requestId=++availabilityRequestSequence,cached=availabilityMonthCache.get(monthKey);
      availabilityLoadError='';
      if(!options.force&&cached&&Date.now()-cached.at<30000){availabilityPlan=cached.plan;availabilityLoading=false;draw();refreshCalendarSyncStatus(monthKey);return}
      availabilityPlan=null;availabilityLoading=true;draw();
      try{
        const [planResult,syncResult]=await Promise.allSettled([api('getMonthSchedule',token,monthKey),api('getResearchCalendarSyncStatus',token,monthKey)]);
        if(planResult.status==='rejected')throw planResult.reason;
        if(requestId!==availabilityRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken||monthKey!==calendarMonthKey(availabilityMonth))return;
        availabilityPlan=planResult.value;availabilityCalendarSync=syncResult.status==='fulfilled'?syncResult.value:null;availabilityCalendarSyncMonth=syncResult.status==='fulfilled'?monthKey:'';availabilityMonthCache.set(monthKey,{at:Date.now(),plan:planResult.value});availabilityLoading=false;availabilityLoadError='';calendarSyncPollCount=0;draw();scheduleCalendarSyncPoll(monthKey);
      }catch(error){
        if(requestId!==availabilityRequestSequence||epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken||monthKey!==calendarMonthKey(availabilityMonth))return;
        availabilityLoading=false;availabilityLoadError=String(error&&error.message||error);draw();showError(error);
      }
    }
    function calendarSyncPending(monthKey){if(monthKey&&availabilityCalendarSyncMonth!==monthKey)return false;return Boolean(availabilityCalendarSync?.researchers?.some(item=>['pending','running','retry_scheduled'].includes(item.status?.status)))}
    function scheduleCalendarSyncPoll(monthKey){clearTimeout(calendarSyncPollTimer);calendarSyncPollTimer=null;if(activeView!=='availability'||!calendarSyncPending(monthKey)||calendarSyncPollCount>=24)return;calendarSyncPollTimer=setTimeout(()=>{calendarSyncPollTimer=null;calendarSyncPollCount++;refreshCalendarSyncStatus(monthKey)},5000)}
    async function refreshCalendarSyncStatus(monthKey){
      if(!sessionToken||activeView!=='availability'||monthKey!==calendarMonthKey(availabilityMonth))return;
      const token=sessionToken,epoch=authEpoch,studyVersion=studyEpoch,studyId=activeStudyId;
      try{const next=await api('getResearchCalendarSyncStatus',token,monthKey);if(epoch!==authEpoch||studyVersion!==studyEpoch||studyId!==activeStudyId||token!==sessionToken||activeView!=='availability'||monthKey!==calendarMonthKey(availabilityMonth))return;availabilityCalendarSync=next;availabilityCalendarSyncMonth=monthKey;draw();scheduleCalendarSyncPoll(monthKey)}
      catch(error){console.warn('[研究工作台] 研究日曆狀態讀取失敗',String(error&&error.message||error))}
    }
  </script>
