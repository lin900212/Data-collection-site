<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>動作與思考研究｜工作台入口</title>
  <style>
    :root{color-scheme:light;--ink:#173d36;--green:#206b5d;--paper:#f5f7f4;--line:#d9e4de;--muted:#75877f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.card{width:min(560px,100%);padding:36px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 14px 36px rgba(20,56,48,.08)}.eyebrow{font-size:11px;letter-spacing:.18em;color:#769188;font-weight:800}.card h1{margin:10px 0;font-family:"Noto Serif TC",serif;font-size:clamp(27px,6vw,36px)}.card p{color:var(--muted);line-height:1.7}.btn{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:10px;background:var(--green);color:#fff;text-decoration:none;font-weight:750}.note{font-size:13px}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">RESEARCH DESK · TEST</div>
    <h1>正在開啟研究工作台</h1>
    <p>登入與研究者確認將由 Google Apps Script 工作台處理。研究者仍須使用團隊信箱的一次性驗證碼。</p>
    <p class="note">若沒有自動跳轉，請使用下方按鈕。</p>
    <a id="openApp" class="btn" href="https://script.google.com/macros/s/AKfycbyhnV-8OJxQehl_I-21Hnvi1wTbN_gu6NdDlzOHvvEsXasfEzUDMQ3JSRY7SIPhfiEL0w/exec">進入測試工作台</a>
  </main>
  <script>
    (() => {
      const target = new URL('https://script.google.com/macros/s/AKfycbyhnV-8OJxQehl_I-21Hnvi1wTbN_gu6NdDlzOHvvEsXasfEzUDMQ3JSRY7SIPhfiEL0w/exec');
      for (const [key, value] of new URLSearchParams(location.search)) {
        if (key !== 'integration') target.searchParams.set(key, value);
      }
      document.getElementById('openApp').href = target.href;
      window.location.replace(target.href);
    })();
  </script>
  <noscript>請啟用 JavaScript，或使用上方的工作台入口。</noscript>
</body>
</html>
